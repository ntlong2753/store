<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{admin/fragments/head :: head('NexGen Admin - Thêm ram Mới')}"></head>
<body>

<!-- SIDEBAR BÊN TRÁI -->
<div th:replace="~{admin/fragments/sidebar :: sidebar('ram')}"></div>

<!-- KHU VỰC BÊN PHẢI -->
<div class="main-content">
    <!-- TOPBAR -->
    <div th:replace="~{admin/fragments/topbar :: topbar('Thêm Bộ nhớ trong (RAM) Mới')}"></div>

    <div class="content-area">
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Nhập thông số sản phẩm</h3>
                <a th:href="@{/admin/ram}" class="btn-secondary" style="padding: 8px 15px;"><i class="fas fa-arrow-left"></i> Quay lại</a>
            </div>

            <div class="card-body">
                <!-- FORM THÊM MỚI -->
                <form th:action="@{/admin/ram/add}" th:object="${product}" method="post" enctype="multipart/form-data">

                    <div class="form-group">
                        <label>Tên ram (Tự động sinh theo dữ liệu dưới):</label>
                        <input type="text" class="form-control" th:field="*{name}" readonly="readonly" placeholder="Hệ thống sẽ tự động ghép tên..." />
                    </div>

                    <div class="form-row">
                        <div class="form-col">
                            <div class="form-group">
                                <label>Hãng sản xuất (Brand):</label>
                                <input type="text" class="form-control" th:field="*{brand}" id="brand" placeholder="Ví dụ: Corsair, Kingston, G.Skill" />
                                <span class="error" th:if="${#fields.hasErrors('brand')}" th:errors="*{brand}"></span>
                            </div>
                        </div>
                        <div class="form-col">
                            <div class="form-group">
                                <label>Dung lượng (Capacity):</label>
                                <input type="text" class="form-control" th:field="*{capacity}" id="capacity" placeholder="Ví dụ: 8GB, 16GB" />
                                <span class="error" th:if="${#fields.hasErrors('capacity')}" th:errors="*{capacity}"></span>
                            </div>
                        </div>
                        <div class="form-col">
                            <div class="form-group">
                                <label>Chuẩn RAM (Standard):</label>
                                <input type="text" class="form-control" th:field="*{ramStandard}" id="ramStandard" placeholder="Ví dụ: DDR4, DDR5" />
                                <span class="error" th:if="${#fields.hasErrors('ramStandard')}" th:errors="*{ramStandard}"></span>
                            </div>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-col">
                            <div class="form-group">
                                <label>Số lượng kho:</label>
                                <input type="number" class="form-control" th:field="*{stock}" />
                                <span class="error" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></span>
                            </div>
                        </div>
                        <div class="form-col">
                            <div class="form-group">
                                <label>Giá bán (VNĐ):</label>
                                <input type="number" class="form-control" th:field="*{price}" step="0.01" />
                                <span class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Mô tả ngắn gọn:</label>
                        <input type="text" class="form-control" th:field="*{description}" />
                    </div>

                    <div class="form-group">
                        <label>Hình ảnh minh họa:</label>
                        <input type="file" class="form-control" style="padding: 9px 15px;" id="imageInput" name="imageFiles" multiple="multiple" accept="image/*" />
                        <div id="previewContainer" style="display: flex; gap: 15px; margin-top: 15px; flex-wrap: wrap;"></div>
                    </div>

                    <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--admin-border);">
                        <button type="submit" class="btn-primary"><i class="fas fa-save"></i> Lưu Sản Phẩm</button>
                        <a th:href="@{/admin/ram}" class="btn-secondary">Hủy bỏ</a>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/admin.js}"></script>
</body>
</html>
