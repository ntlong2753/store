<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{admin/fragments/head :: head('NexGen Admin - Quản Lý ram')}"></head>
<body>

<!-- SIDEBAR BÊN TRÁI -->
<div th:replace="~{admin/fragments/sidebar :: sidebar('ram')}"></div>

<!-- KHU VỰC BÊN PHẢI -->
<div class="main-content">

    <div th:replace="~{admin/fragments/topbar :: topbar('Quản lý Vi xử lý (ram)')}"></div>

    <!-- KHU VỰC ĐỂ CÁI BẢNG -->
    <div class="content-area">
        <div class="card">

            <!-- TIÊU ĐỀ BẢNG VÀ NÚT THÊM MỚI -->
            <div class="card-header">
                <h3 class="card-title">Danh sách RAM trong kho</h3>
                <a th:href="@{/admin/ram/add}" class="btn-primary">
                    <i class="fas fa-plus"></i> Thêm RAM Mới
                </a>
            </div>

            <div class="card-body">

                <!-- 1. Báo rỗng nếu Danh sách rỗng (Chưa có sản phẩm nào) -->
                <div class="empty-state" th:if="${rams.isEmpty()}">
                    <i class="fas fa-box-open"></i>
                    <h3>Kho ram đang trống</h3>
                    <p>Chưa có sản phẩm nào trong cơ sở dữ liệu. Hãy bấm "Thêm ram Mới"!</p>
                </div>

                <!-- 2. Bảng Dữ liệu (Nếu có sản phẩm thì hiện bảng này) -->
                <div class="table-responsive" th:unless="${rams.isEmpty()}">
                    <table>
                        <thead>
                        <tr>
                            <th style="width: 50px; text-align: center;">STT</th>
                            <th style="width: 350px;">Sản phẩm</th>
                            <th>Thông số chính</th>
                            <th>Trạng thái kho</th>
                            <th>Giá bán</th>
                            <th style="width: 120px; text-align: center;">Hành động</th>
                        </tr>
                        </thead>
                        <tbody>
                        <!-- Lặp từng ram trong biến 'rams' -->
                        <tr th:each="ram, iter : ${rams}">

                            <!-- Cột STT -->
                            <td style="text-align: center; font-weight: bold;" th:text="${iter.count}">1</td>

                            <!-- Cột Hình ảnh + Tên -->
                            <td>
                                <div style="display: flex; align-items: center; gap: 15px;">
                                    <!-- Hình ảnh -->
                                    <img th:if="${!#lists.isEmpty(ram.images)}" th:src="@{${ram.images[0].path}}" class="product-img" alt="img" />
                                    <div th:if="${#lists.isEmpty(ram.images)}" class="no-img">No Img</div>

                                    <!-- Tên và hãng -->
                                    <div>
                                        <span class="product-name" th:text="${ram.name}">Tên RAM</span>
                                        <span class="product-brand" th:text="${ram.brand}">Hãng RAM</span>
                                    </div>
                                </div>
                            </td>

                            <!-- Cột Thông số -->
                            <td>
                                <div style="font-size: 12px; color: #7e8299;">
                                    <div>Dung lượng: <strong style="color: #3f4254;" th:text="${ram.capacity}">...</strong></div>
                                    <div>Chuẩn RAM: <strong style="color: #3f4254;" th:text="${ram.ramStandard}">...</strong></div>
                                </div>
                            </td>

                            <!-- Cột Số lượng (Kho) -->
                            <td>
                                <span class="badge badge-success" th:if="${ram.stock > 0}" th:text="'Còn ' + ${ram.stock} + ' cái'">Còn hàng</span>
                                <span class="badge badge-danger" th:if="${ram.stock <= 0}">Hết hàng</span>
                            </td>

                            <!-- Cột Giá tiền -->
                            <td class="price" th:text="${#numbers.formatDecimal(ram.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                                0 đ
                            </td>

                            <!-- Cột Hành động (Sửa / Xóa) -->
                            <td>
                                <div class="action-btns" style="justify-content: center;">
                                    <!-- Nút Sửa -->
                                    <a th:href="@{/admin/ram/edit/{id}(id=${ram.id})}" class="btn-icon btn-edit" title="Chỉnh sửa ram">
                                        <i class="fas fa-pen"></i>
                                    </a>
                                    <!-- Nút Xóa -->
                                    <a th:href="@{/admin/ram/delete/{id}(id=${ram.id})}"
                                       onclick="return confirm('CẢNH BÁO: Bạn có chắc chắn muốn xóa linh kiện này khỏi hệ thống không?')"
                                       class="btn-icon btn-delete" title="Xóa ram">
                                        <i class="fas fa-trash"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

            </div> <!-- Hết card-body -->

            <!-- KHU VỰC CHUYỂN TRANG -->
            <div th:replace="~{admin/fragments/pagination :: pagination(${rams}, '/admin/ram')}"></div>
        </div> <!-- Hết card -->
    </div> <!-- Hết content-area -->

</div> <!-- Hết main-content -->

</body>
</html>
