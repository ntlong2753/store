<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hệ thống gặp sự cố - NexGen PC</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            background-color: #f5f6fa;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #2d3436;
        }
        .error-container {
            text-align: center;
            background: white;
            padding: 60px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            max-width: 500px;
            width: 90%;
        }
        .error-code {
            font-size: 120px;
            font-weight: 900;
            color: #f39c12;
            line-height: 1;
            margin-bottom: 20px;
            text-shadow: 4px 4px 0px #fdebd0;
        }
        .error-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 15px;
        }
        .error-message {
            font-size: 15px;
            color: #636e72;
            margin-bottom: 35px;
            line-height: 1.6;
        }
        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #f39c12;
            color: white;
            text-decoration: none;
            padding: 14px 30px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 16px;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(243, 156, 18, 0.3);
        }
        .btn-home:hover {
            background: #d68910;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="error-container">
        <div class="error-code">500</div>
        <div class="error-title">Hệ thống đang gặp sự cố</div>
        <div class="error-message">
            Máy chủ của chúng tôi vừa gặp phải một chút rắc rối kỹ thuật. Đội ngũ kỹ thuật viên đang nỗ lực khắc phục vấn đề này sớm nhất có thể. Thành thật xin lỗi bạn vì sự bất tiện này!
        </div>
        <a th:href="@{/}" class="btn-home">
            <i class="fas fa-home"></i> Trở về Trang Chủ
        </a>
    </div>

</body>
</html>
