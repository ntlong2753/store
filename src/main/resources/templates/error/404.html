<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Không tìm thấy trang - NexGen PC</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            background-color: #f5f6fa;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #2d3436;
        }
        .error-container {
            text-align: center;
            background: white;
            padding: 60px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            max-width: 500px;
            width: 90%;
        }
        .error-code {
            font-size: 120px;
            font-weight: 900;
            color: #e30019;
            line-height: 1;
            margin-bottom: 20px;
            text-shadow: 4px 4px 0px #ffcccc;
        }
        .error-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 15px;
        }
        .error-message {
            font-size: 15px;
            color: #636e72;
            margin-bottom: 35px;
            line-height: 1.6;
        }
        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #e30019;
            color: white;
            text-decoration: none;
            padding: 14px 30px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 16px;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(227, 0, 25, 0.3);
        }
        .btn-home:hover {
            background: #c40015;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="error-container">
        <div class="error-code">404</div>
        <div class="error-title">Ôi không! Lạc đường rồi...</div>
        <div class="error-message">
            Trang bạn đang tìm kiếm có thể đã bị xóa, thay đổi đường dẫn hoặc hoàn toàn không tồn tại trên hệ thống của NexGen PC.
        </div>
        <a th:href="@{/}" class="btn-home">
            <i class="fas fa-home"></i> Quay về Trang Chủ
        </a>
    </div>

</body>
</html>
