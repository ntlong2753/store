<div th:fragment="sidebar(activeItem)" class="sidebar">
    <div class="sidebar-header">
        NexGen <span>Admin</span>
    </div>
    <div class="sidebar-menu">
        <div class="menu-title">Lối tắt</div>
        <a th:href="@{/}" class="menu-item">
            <i class="fas fa-store"></i> Ra Cửa Hàng
        </a>

        <div class="menu-title" style="margin-top: 15px;">Hệ thống</div>
        <a th:href="@{/admin}" th:classappend="${activeItem == 'dashboard'} ? 'active' : ''" class="menu-item">
            <i class="fas fa-chart-pie"></i> Tổng quan (Dashboard)
        </a>

        <div class="menu-title" style="margin-top: 15px;">Quản lý kho</div>
        <a th:href="@{/admin/cpu}" th:classappend="${activeItem == 'cpu'} ? 'active' : ''" class="menu-item">
            <i class="fas fa-microchip"></i> Vi xử lý (CPU)
        </a>
        <a th:href="@{/admin/mainboard}" th:classappend="${activeItem == 'mainboard'} ? 'active' : ''"
           class="menu-item">
            <i class="fas fa-chess-board"></i> Bo mạch chủ (Main)
        </a>
        <a th:href="@{/admin/ram}" th:classappend="${activeItem == 'ram'} ? 'active' : ''" class="menu-item">
            <i class="fas fa-memory"></i> Bộ nhớ (RAM)
        </a>
        <a th:href="@{/admin/vga}" th:classappend="${activeItem == 'vga'} ? 'active' : ''" class="menu-item">
            <i class="fas fa-tv"></i> Card đồ họa (VGA)
        </a>
        <a th:href="@{/admin/storage}" th:classappend="${activeItem == 'storage'} ? 'active' : ''" class="menu-item">
            <i class="fas fa-hdd"></i> Ổ cứng (Storage)
        </a>
        <a th:href="@{/admin/casepc}" th:classappend="${activeItem == 'casepc'} ? 'active' : ''" class="menu-item">
            <i class="fas fa-box"></i> Vỏ máy tính (Case)
        </a>
        <a th:href="@{/admin/psu}" th:classappend="${activeItem == 'psu'} ? 'active' : ''" class="menu-item">
            <i class="fas fa-plug"></i> Nguồn (PSU)
        </a>

        <div class="menu-title" style="margin-top: 15px;">Đơn hàng</div>
        <a href="#" th:classappend="${activeItem == 'orders'} ? 'active' : ''" class="menu-item">
            <i class="fas fa-file-invoice"></i> Quản lý Đơn hàng
        </a>
    </div>
</div>
