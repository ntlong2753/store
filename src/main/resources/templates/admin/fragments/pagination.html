<!--suppress CssUnresolvedCustomProperty -->
<!--/*@thymesVar id="pageData" type="org.springframework.data.domain.Page"*/-->
<div th:fragment="pagination(pageData, baseUrl)" th:if="${pageData.totalPages > 1}" style="display: flex; justify-content: center; margin-top: 25px; padding-bottom: 25px;">
    <ul style="list-style: none; display: flex; gap: 8px; padding: 0; margin: 0;">
        <!-- Nút Trở Lùi (Trang trước) -->
        <li>
            <a th:href="@{${baseUrl}(page=${pageData.number - 1})}"
               style="padding: 8px 14px; border: 1px solid var(--admin-border); border-radius: 6px; text-decoration: none; color: var(--admin-text); background: white; font-size: 14px; font-weight: 500;"
               th:styleappend="${pageData.first} ? 'pointer-events: none; opacity: 0.4; background: #f3f6f9;' : ''">
                <i class="fas fa-angle-left"></i> Lùi
            </a>
        </li>
        <!-- Các nút số trang (1, 2, 3...) -->
        <li th:each="i : ${#numbers.sequence(0, pageData.totalPages - 1)}">
            <a th:href="@{${baseUrl}(page=${i})}" th:text="${i + 1}"
               style="padding: 8px 14px; border: 1px solid var(--admin-border); border-radius: 6px; text-decoration: none; color: var(--admin-text); background: white; font-size: 14px; font-weight: 600;"
               th:styleappend="${i == pageData.number} ? 'background: var(--admin-accent); color: white; border-color: var(--admin-accent);' : ''">
            </a>
        </li>
        <!-- Nút Tới (Trang sau) -->
        <li>
            <a th:href="@{${baseUrl}(page=${pageData.number + 1})}"
               style="padding: 8px 14px; border: 1px solid var(--admin-border); border-radius: 6px; text-decoration: none; color: var(--admin-text); background: white; font-size: 14px; font-weight: 500;"
               th:styleappend="${pageData.last} ? 'pointer-events: none; opacity: 0.4; background: #f3f6f9;' : ''">
                Tới <i class="fas fa-angle-right"></i>
            </a>
        </li>
    </ul>
</div>
