<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{admin/fragments/head :: head('NexGen Admin - Quản lý Vỏ Máy Tính (Case)')}"></head>
<body>

<!-- SIDEBAR BÊN TRÁI -->
<div th:replace="~{admin/fragments/sidebar :: sidebar('casepc')}"></div>

<!-- KHU VỰC BÊN PHẢI -->
<div class="main-content">
    <div class="topbar">
        <h2 class="page-title">Kho Vỏ Máy Tính (Case)</h2>
        <div class="user-profile">
            <form th:action="@{/logout}" method="post" style="margin: 0;">
                <button type="submit" class="btn-logout"><i class="fas fa-sign-out-alt"></i> Đăng xuất hệ thống</button>
            </form>
        </div>
    </div>

    <div class="content-area">
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Danh sách Case</h3>
                <a th:href="@{/admin/casepc/add}" class="btn-primary"><i class="fas fa-plus"></i> Thêm Case Mới</a>
            </div>

            <div class="card-body">

                <!-- 1. Báo rỗng nếu Danh sách rỗng -->
                <div class="empty-state" th:if="${casepcs.isEmpty()}">
                    <i class="fas fa-box-open"></i>
                    <h3>Kho Case đang trống</h3>
                    <p>Chưa có sản phẩm nào trong cơ sở dữ liệu. Hãy bấm "Thêm Case Mới"!</p>
                </div>

                <!-- 2. Bảng Dữ liệu -->
                <div class="table-responsive" th:unless="${casepcs.isEmpty()}">
                    <table>
                        <thead>
                        <tr>
                            <th style="width: 50px; text-align: center;">STT</th>
                            <th style="width: 300px;">Sản phẩm</th>
                            <th style="width: 260px;">Thông số chính</th>
                            <th style="width: 130px;">Trạng thái kho</th>
                            <th style="width: 140px;">Giá bán</th>
                            <th style="width: 120px; text-align: center;">Hành động</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="casepc, iter : ${casepcs}">
                            <!-- Cột STT -->
                            <td style="text-align: center; font-weight: bold;" th:text="${iter.count}">1</td>

                            <!-- Cột Hình ảnh + Tên -->
                            <td>
                                <div style="display: flex; align-items: center; gap: 15px;">
                                    <!-- Hình ảnh -->
                                    <img th:if="${!#lists.isEmpty(casepc.images)}" th:src="@{${casepc.images[0].path}}"
                                         class="product-img" alt="img"/>
                                    <div th:if="${#lists.isEmpty(casepc.images)}" class="no-img"
                                         style="font-size: 12px;">No Img
                                    </div>

                                    <!-- Tên và hãng -->
                                    <div>
                                        <span style="display: block; font-weight: 600; color: var(--admin-text); font-size: 15px; margin-bottom: 3px; line-height: 1.3;"
                                              th:text="${casepc.name}">Tên Case</span>
                                        <span style="display: block; font-size: 12px; color: #b5b5c3; font-weight: 500;"
                                              th:text="${casepc.brand}">Hãng</span>
                                    </div>
                                </div>
                            </td>

                            <!-- Cột Thông số -->
                            <td>
                                <div style="font-size: 12px; color: #7e8299;">
                                    <div>Kích thước: <strong style="color: #3f4254;"
                                                             th:text="${casepc.formFactor}">...</strong></div>
                                    <div>Hỗ trợ Main: <strong style="color: #3f4254;"
                                                              th:text="${casepc.supportedMainboard}">...</strong></div>
                                </div>
                            </td>

                            <!-- Cột Số lượng (Kho) -->
                            <td>
                                <span th:if="${casepc.stock > 0}" class="badge badge-success"
                                      th:text="'Còn ' + ${casepc.stock} + ' cái'">Còn hàng</span>
                                <span th:if="${casepc.stock <= 0}" class="badge badge-danger">Hết hàng</span>
                            </td>

                            <!-- Cột Giá tiền -->
                            <td class="price" style="font-weight: 700; color: #f64e60; white-space: nowrap;"
                                th:text="${#numbers.formatDecimal(casepc.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                                0 đ
                            </td>

                            <!-- Cột Nút Hành Động -->
                            <td>
                                <div class="action-btns" style="justify-content: center;">
                                    <a th:href="@{/admin/casepc/edit/{id}(id=${casepc.id})}" class="btn-icon btn-edit"
                                       title="Sửa"><i class="fas fa-pen"></i></a>
                                    <a th:href="@{/admin/casepc/delete/{id}(id=${casepc.id})}"
                                       class="btn-icon btn-delete" title="Xóa"
                                       onclick="return confirm('Bạn có chắc chắn muốn xóa Case này không? Mọi dữ liệu và hình ảnh liên quan sẽ bị xóa vĩnh viễn!');"><i
                                            class="fas fa-trash"></i></a>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

            </div> <!-- Hết card-body -->

            <!-- KHU VỰC CHUYỂN TRANG -->
            <div th:replace="~{admin/fragments/pagination :: pagination(${casepcs}, '/admin/casepc')}"></div>
        </div> <!-- Hết card -->
    </div> <!-- Hết content-area -->

</div>

</body>
</html>
