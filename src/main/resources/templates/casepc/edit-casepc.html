<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{admin/fragments/head :: head('NexGen Admin - Chỉnh sửa Case')}"></head>
<body>

<!-- SIDEBAR BÊN TRÁI -->
<div th:replace="~{admin/fragments/sidebar :: sidebar('casepc')}"></div>

<!-- KHU VỰC BÊN PHẢI -->
<div class="main-content">
    <div th:replace="~{admin/fragments/topbar :: topbar('Chỉnh sửa Case')}"></div>

    <div class="content-area">
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Cập nhật thông số Case</h3>
                <a th:href="@{/admin/casepc}" class="btn-secondary" style="padding: 8px 15px;"><i
                        class="fas fa-arrow-left"></i> Quay lại</a>
            </div>

            <div class="card-body">
                <form th:action="@{/admin/casepc/edit}" th:object="${product}" method="post"
                      enctype="multipart/form-data" id="editForm">

                    <input type="hidden" th:field="*{id}"/>

                    <div class="form-group">
                        <label>Tên Case (*):</label>
                        <input type="text" class="form-control" th:field="*{name}"/>
                        <span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
                    </div>

                    <div class="form-group">
                        <label>Hãng (*):</label>
                        <input type="text" class="form-control" th:field="*{brand}"/>
                        <span class="error" th:if="${#fields.hasErrors('brand')}" th:errors="*{brand}"></span>
                    </div>

                    <div class="form-group">
                        <label>Model (*):</label>
                        <input type="text" class="form-control" th:field="*{modelNumber}"/>
                        <span class="error" th:if="${#fields.hasErrors('modelNumber')}"
                              th:errors="*{modelNumber}"></span>
                    </div>

                    <div class="form-group">
                        <label>Kích thước (Form Factor) (*):</label>
                        <input type="text" class="form-control" th:field="*{formFactor}"/>
                        <span class="error" th:if="${#fields.hasErrors('formFactor')}" th:errors="*{formFactor}"></span>
                    </div>

                    <div class="form-group">
                        <label>Hỗ trợ Mainboard:</label>
                        <input type="text" class="form-control" th:field="*{supportedMainboard}"/>
                    </div>

                    <div class="form-row">
                        <div class="form-col">
                            <div class="form-group">
                                <label>Số lượng kho:</label>
                                <input type="number" class="form-control" th:field="*{stock}"/>
                                <span class="error" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></span>
                            </div>
                        </div>
                        <div class="form-col">
                            <div class="form-group">
                                <label>Giá bán (VNĐ):</label>
                                <input type="number" class="form-control" th:field="*{price}" step="0.01"/>
                                <span class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Mô tả ngắn gọn:</label>
                        <input type="text" class="form-control" th:field="*{description}"/>
                    </div>

                    <div class="form-group">
                        <label>Hình ảnh hiện tại (Bấm X để xóa ảnh cũ):</label>
                        <div style="display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap;"
                             id="existingImagesContainer">
                            <div th:each="img : *{images}" th:id="'old-img-container-' + ${img.id}"
                                 style="position: relative; display: inline-block;">
                                <img th:src="@{${img.path}}"
                                     style="width: 100px; height: 100px; object-fit: cover; border-radius: 6px; border: 1px solid #ebedf3;"/>
                                <button type="button" th:onclick="'deleteOldImage(' + ${img.id} + ')'"
                                        style="position: absolute; top: -5px; right: -5px; background: #f64e60; color: white; border: none; border-radius: 50%; width: 24px; height: 24px; cursor: pointer;">
                                    <i class="fas fa-times"></i>
                                </button>
                                <!-- Checkbox ẩn để gửi danh sách ID ảnh bị xóa -->
                                <input type="checkbox" name="deletedImageIds" th:value="${img.id}"
                                       th:id="'delete-checkbox-' + ${img.id}" style="display: none;"/>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Thêm hình ảnh mới (Có thể chọn nhiều ảnh):</label>
                        <input type="file" class="form-control" style="padding: 9px 15px;" id="imageInput"
                               name="imageFiles" multiple="multiple" accept="image/*"/>
                        <div id="previewContainer"
                             style="display: flex; gap: 15px; margin-top: 15px; flex-wrap: wrap;"></div>
                    </div>

                    <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--admin-border);">
                        <button type="submit" class="btn-primary"><i class="fas fa-save"></i> Cập Nhật Sản Phẩm</button>
                        <a th:href="@{/admin/casepc}" class="btn-secondary">Hủy bỏ</a>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/admin.js}"></script>
</body>
</html>
