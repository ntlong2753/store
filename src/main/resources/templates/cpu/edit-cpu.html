<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <title>Sửa thông tin CPU</title>
  <style>
    .error { color: red; font-size: 14px; }
  </style>
</head>
<body>
<h1>Thêm CPU Mới</h1>
<!-- Chú ý th:action trỏ về đúng /admin/cpu/add và th:object là product -->
<!-- Thêm dòng ghi chú này để IntelliJ hết báo đỏ -->
<!--/*@thymesVar id="product" type="com.codegym.store.model.Cpu"*/-->
<form th:action="@{/admin/cpu/add}" th:object="${product}" method="post" enctype="multipart/form-data">
  <input type="hidden" th:field="*{id}" />

  <label>Tên CPU:</label>
  <label>
    <input type="text" th:field="*{name}" readonly="readonly" style="background-color: #e9ecef;"/>
  </label>
  <br/>

  <label>Phân khúc (Segment):</label>
  <label>
    <input type="text" th:field="*{segment}" />
  </label>
  <span class="error" th:if="${#fields.hasErrors('segment')}" th:errors="*{segment}"></span><br/>

  <label>Mã model (Model Number):</label>
  <label>
    <input type="text" th:field="*{modelNumber}" />
  </label>
  <span class="error" th:if="${#fields.hasErrors('modelNumber')}" th:errors="*{modelNumber}"></span><br/>

  <label>Hậu tố (Suffix):</label>
  <label>
    <input type="text" th:field="*{suffix}" />
  </label>
  <span class="error" th:if="${#fields.hasErrors('suffix')}" th:errors="*{suffix}"></span><br/>

  <label>Dòng (Series):</label>
  <label>
    <input type="text" th:field="*{series}" />
  </label>
  <span class="error" th:if="${#fields.hasErrors('series')}" th:errors="*{series}"></span><br/>

  <label>Số nhân (Cores):</label>
  <label>
    <input type="number" th:field="*{cores}" />
  </label>
  <span class="error" th:if="${#fields.hasErrors('cores')}" th:errors="*{cores}"></span><br/>

  <label>Số luồng (Threads):</label>
  <label>
    <input type="number" th:field="*{threads}" />
  </label>
  <span class="error" th:if="${#fields.hasErrors('threads')}" th:errors="*{threads}"></span><br/>

  <label>Socket:</label>
  <label>
    <input type="text" th:field="*{socket}" />
  </label><br/>

  <label>Mô tả: </label>
  <label>
    <input type="text" th:field="*{description}" />
  </label><br/>

  <label>Số lượng kho:</label>
  <label>
    <input type="number" th:field="*{stock}" />
  </label>
  <span class="error" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></span><br/>

  <label>Giá (VNĐ):</label>
  <label>
    <input type="number" th:field="*{price}" step="0.01" />
  </label>
  <span class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span><br/>

  <!-- 1. Thẻ ẩn lưu ID các ảnh cũ bị xóa -->
  <input type="hidden" id="deletedImageIds" name="deletedImageIds" value="" />

  <!-- 2. Khung hiển thị các ẢNH CŨ đã lưu trong Database -->
  <label>Ảnh hiện tại (Bấm X để xóa):</label>
  <div style="display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap;">
    <div th:each="img : *{images}" th:id="'old-img-container-' + ${img.id}" style="position: relative; display: inline-block;">
      <img th:src="@{${img.path}}" style="width: 100px; height: 100px; object-fit: cover; border: 1px solid #ccc;" />
      <button type="button" th:onclick="'deleteOldImage(' + ${img.id} + ')'"
              style="position: absolute; top: 0; right: 0; background: red; color: white; border: none; cursor: pointer;">
        X
      </button>
    </div>
    <span th:if="${#lists.isEmpty(product.images)}" style="color: gray; font-size: 14px;">Chưa có ảnh nào.</span>
  </div>

  <!-- 3. Khu vực chọn THÊM ẢNH MỚI (Giống bên trang Add) -->
  <label>Chọn thêm ảnh mới:</label>
  <input type="file" id="imageInput" name="imageFiles" multiple="multiple" accept="image/*" />
  <div id="previewContainer" style="display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap;"></div>
  <br/>


  <button type="submit" style="margin-top: 15px; cursor: pointer;">Lưu lại</button>

  <!-- NÚT HỦY MỚI THÊM VÀO -->
  <a th:href="@{/admin/cpu}" style="text-decoration: none;">
    <!-- Dùng CSS để ép cái nút đứng cạnh nút Lưu lại -->
    <button type="button" style="margin-top: 15px; margin-left: 10px; cursor: pointer;">Hủy</button>
  </a>
</form>

<script>
  // ----------------------------------------------------------------
  // 1. TÍNH NĂNG TỰ ĐỘNG NỐI CHUỖI TÊN CPU (Giữ nguyên)
  // ----------------------------------------------------------------
  const nameInput = document.getElementById('name');
  const seriesInput = document.getElementById('series');
  const segmentInput = document.getElementById('segment');
  const modelNumberInput = document.getElementById('modelNumber');
  const suffixInput = document.getElementById('suffix');

  function updateCpuName() {
    const series = seriesInput.value.trim();
    const segment = segmentInput.value.trim();
    const modelNumber = modelNumberInput.value.trim();
    const suffix = suffixInput.value.trim();
    const suffixText = suffix ? suffix : '';
    nameInput.value = `${series} ${segment} ${modelNumber}${suffixText}`.trim();
  }

  seriesInput.addEventListener('input', updateCpuName);
  segmentInput.addEventListener('input', updateCpuName);
  modelNumberInput.addEventListener('input', updateCpuName);
  suffixInput.addEventListener('input', updateCpuName);


  // ----------------------------------------------------------------
  // 2. TÍNH NĂNG XÓA ẢNH CŨ (THÊM MỚI)
  // ----------------------------------------------------------------
  const deletedImageIdsInput = document.getElementById('deletedImageIds');
  let deletedIds = []; // Mảng chứa ID các ảnh bị xóa

  function deleteOldImage(imageId) {
    // Ẩn khối div chứa ảnh đó đi
    document.getElementById('old-img-container-' + imageId).style.display = 'none';

    // Nhét ID vào mảng và cập nhật vào thẻ hidden input
    deletedIds.push(imageId);
    deletedImageIdsInput.value = deletedIds.join(',');
  }


  // ----------------------------------------------------------------
  // 3. TÍNH NĂNG XEM TRƯỚC VÀ XÓA ẢNH MỚI CHỌN (Giống bên Add)
  // ----------------------------------------------------------------
  const imageInput = document.getElementById('imageInput');
  const previewContainer = document.getElementById('previewContainer');
  let selectedFiles = new DataTransfer();

  imageInput.addEventListener('change', function(event) {
    const files = event.target.files;
    for(let i = 0; i < files.length; i++) {
      selectedFiles.items.add(files[i]);
    }
    updateImagePreview();
  });

  function updateImagePreview() {
    previewContainer.innerHTML = '';
    imageInput.files = selectedFiles.files;

    Array.from(selectedFiles.files).forEach((file, index) => {
      const reader = new FileReader();
      reader.onload = function(e) {
        const wrapper = document.createElement('div');
        wrapper.style.position = 'relative';
        wrapper.style.display = 'inline-block';

        const img = document.createElement('img');
        img.src = e.target.result;
        img.style.width = '100px';
        img.style.height = '100px';
        img.style.objectFit = 'cover';
        img.style.border = '1px solid #ccc';

        const deleteBtn = document.createElement('button');
        deleteBtn.innerHTML = 'X';
        deleteBtn.style.position = 'absolute';
        deleteBtn.style.top = '0';
        deleteBtn.style.right = '0';
        deleteBtn.style.background = 'red';
        deleteBtn.style.color = 'white';
        deleteBtn.style.border = 'none';
        deleteBtn.style.cursor = 'pointer';

        deleteBtn.onclick = function(e) {
          e.preventDefault();
          removeFile(index);
        };

        wrapper.appendChild(img);
        wrapper.appendChild(deleteBtn);
        previewContainer.appendChild(wrapper);
      }
      reader.readAsDataURL(file);
    });
  }

  function removeFile(indexToRemove) {
    const newFiles = new DataTransfer();
    const currentFiles = selectedFiles.files;
    for(let i = 0; i < currentFiles.length; i++) {
      if(i !== indexToRemove) {
        newFiles.items.add(currentFiles[i]);
      }
    }
    selectedFiles = newFiles;
    updateImagePreview();
  }
</script>

</body>
</html>
