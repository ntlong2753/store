<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{admin/fragments/head :: head('NexGen Admin - Quản Lý CPU')}"></head>
<body>

<!-- SIDEBAR BÊN TRÁI -->
<div th:replace="~{admin/fragments/sidebar :: sidebar('cpu')}"></div>

<!-- KHU VỰC BÊN PHẢI -->
<div class="main-content">

    <div th:replace="~{admin/fragments/topbar :: topbar('Quản lý Vi xử lý (CPU)')}"></div>

    <!-- KHU VỰC ĐỂ CÁI BẢNG -->
    <div class="content-area">
        <div class="card">

            <!-- TIÊU ĐỀ BẢNG VÀ NÚT THÊM MỚI -->
            <div class="card-header">
                <h3 class="card-title">Danh sách CPU trong kho</h3>
                <a th:href="@{/admin/cpu/add}" class="btn-primary">
                    <i class="fas fa-plus"></i> Thêm CPU Mới
                </a>
            </div>

            <div class="card-body">

                <!-- 1. Báo rỗng nếu Danh sách rỗng (Chưa có sản phẩm nào) -->
                <div class="empty-state" th:if="${cpus.isEmpty()}">
                    <i class="fas fa-box-open"></i>
                    <h3>Kho CPU đang trống</h3>
                    <p>Chưa có sản phẩm nào trong cơ sở dữ liệu. Hãy bấm "Thêm CPU Mới"!</p>
                </div>

                <!-- 2. Bảng Dữ liệu (Nếu có sản phẩm thì hiện bảng này) -->
                <div class="table-responsive" th:unless="${cpus.isEmpty()}">
                    <table>
                        <thead>
                        <tr>
                            <th style="width: 50px; text-align: center;">STT</th>
                            <th style="width: 350px;">Sản phẩm</th>
                            <th>Thông số chính</th>
                            <th>Trạng thái kho</th>
                            <th>Giá bán</th>
                            <th style="width: 120px; text-align: center;">Hành động</th>
                        </tr>
                        </thead>
                        <tbody>
                        <!-- Lặp từng CPU trong biến 'cpus' -->
                        <tr th:each="cpu, iter : ${cpus}">

                            <!-- Cột STT -->
                            <td style="text-align: center; font-weight: bold;" th:text="${iter.count}">1</td>

                            <!-- Cột Hình ảnh + Tên -->
                            <td>
                                <div style="display: flex; align-items: center; gap: 15px;">
                                    <!-- Hình ảnh -->
                                    <img th:if="${!#lists.isEmpty(cpu.images)}" th:src="@{${cpu.images[0].path}}"
                                         class="product-img" alt="img"/>
                                    <div th:if="${#lists.isEmpty(cpu.images)}" class="no-img">No Img</div>

                                    <!-- Tên và hãng -->
                                    <div>
                                        <span class="product-name" th:text="${cpu.name}">Tên CPU</span>
                                        <span class="product-brand"
                                              th:text="${cpu.series} + ' | Phân khúc ' + ${cpu.segment}">Dòng sản phẩm</span>
                                    </div>
                                </div>
                            </td>

                            <!-- Cột Thông số -->
                            <td>
                                <div style="font-size: 12px; color: #7e8299;">
                                    <div>Mã Model: <strong style="color: #3f4254;"
                                                           th:text="${cpu.modelNumber} + ' ' + (${#strings.isEmpty(cpu.suffix)} ? '' : ${cpu.suffix})">...</strong>
                                    </div>
                                    <div>Socket: <strong style="color: #3f4254;" th:text="${cpu.socket}">...</strong>
                                    </div>
                                    <div>Nhân/Luồng: <strong style="color: #3f4254;"
                                                             th:text="${cpu.cores} + '/' + ${cpu.threads}">...</strong>
                                    </div>
                                </div>
                            </td>

                            <!-- Cột Số lượng (Kho) -->
                            <td>
                                <span class="badge badge-success" th:if="${cpu.stock > 0}"
                                      th:text="'Còn ' + ${cpu.stock} + ' cái'">Còn hàng</span>
                                <span class="badge badge-danger" th:if="${cpu.stock <= 0}">Hết hàng</span>
                            </td>

                            <!-- Cột Giá tiền -->
                            <td class="price"
                                th:text="${#numbers.formatDecimal(cpu.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                                0 đ
                            </td>

                            <!-- Cột Hành động (Sửa / Xóa) -->
                            <td>
                                <div class="action-btns" style="justify-content: center;">
                                    <!-- Nút Sửa -->
                                    <a th:href="@{/admin/cpu/edit/{id}(id=${cpu.id})}" class="btn-icon btn-edit"
                                       title="Chỉnh sửa CPU">
                                        <i class="fas fa-pen"></i>
                                    </a>
                                    <!-- Nút Xóa -->
                                    <a th:href="@{/admin/cpu/delete/{id}(id=${cpu.id})}"
                                       onclick="return confirm('CẢNH BÁO: Bạn có chắc chắn muốn xóa linh kiện này khỏi hệ thống không?')"
                                       class="btn-icon btn-delete" title="Xóa CPU">
                                        <i class="fas fa-trash"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

            </div> <!-- Hết card-body -->

            <!-- KHU VỰC CHUYỂN TRANG -->
            <div th:replace="~{admin/fragments/pagination :: pagination(${cpus}, '/admin/cpu')}"></div>
        </div> <!-- Hết card -->
    </div> <!-- Hết content-area -->

</div> <!-- Hết main-content -->

</body>
</html>
