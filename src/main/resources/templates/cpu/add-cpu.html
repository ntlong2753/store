<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{admin/fragments/head :: head('NexGen Admin - Thêm CPU Mới')}"></head>
<body>

<!-- SIDEBAR BÊN TRÁI -->
<div th:replace="~{admin/fragments/sidebar :: sidebar('cpu')}"></div>

<!-- KHU VỰC BÊN PHẢI -->
<div class="main-content">
    <!-- TOPBAR -->
    <div th:replace="~{admin/fragments/topbar :: topbar('Thêm CPU Mới')}"></div>

    <div class="content-area">
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Nhập thông số sản phẩm</h3>
                <a th:href="@{/admin/cpu}" class="btn-secondary" style="padding: 8px 15px;"><i class="fas fa-arrow-left"></i> Quay lại</a>
            </div>

            <div class="card-body">
                <!-- FORM THÊM MỚI -->
                <form th:action="@{/admin/cpu/add}" th:object="${product}" method="post" enctype="multipart/form-data">

                    <div class="form-group">
                        <label>Tên CPU (Tự động sinh theo dữ liệu dưới):</label>
                        <input type="text" class="form-control" th:field="*{name}" readonly="readonly" placeholder="Hệ thống sẽ tự động ghép tên..." />
                    </div>

                    <div class="form-row">
                        <div class="form-col">
                            <div class="form-group">
                                <label>Dòng (Series):</label>
                                <input type="text" class="form-control" th:field="*{series}" placeholder="Ví dụ: Intel Core" />
                                <span class="error" th:if="${#fields.hasErrors('series')}" th:errors="*{series}"></span>
                            </div>
                        </div>
                        <div class="form-col">
                            <div class="form-group">
                                <label>Phân khúc (Segment):</label>
                                <input type="text" class="form-control" th:field="*{segment}" placeholder="Ví dụ: i9" />
                                <span class="error" th:if="${#fields.hasErrors('segment')}" th:errors="*{segment}"></span>
                            </div>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-col">
                            <div class="form-group">
                                <label>Mã model (Model Number):</label>
                                <input type="text" class="form-control" th:field="*{modelNumber}" placeholder="Ví dụ: 14900" />
                                <span class="error" th:if="${#fields.hasErrors('modelNumber')}" th:errors="*{modelNumber}"></span>
                            </div>
                        </div>
                        <div class="form-col">
                            <div class="form-group">
                                <label>Hậu tố (Suffix):</label>
                                <input type="text" class="form-control" th:field="*{suffix}" placeholder="Ví dụ: K" />
                                <span class="error" th:if="${#fields.hasErrors('suffix')}" th:errors="*{suffix}"></span>
                            </div>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-col">
                            <div class="form-group">
                                <label>Số nhân (Cores):</label>
                                <input type="number" class="form-control" th:field="*{cores}" />
                                <span class="error" th:if="${#fields.hasErrors('cores')}" th:errors="*{cores}"></span>
                            </div>
                        </div>
                        <div class="form-col">
                            <div class="form-group">
                                <label>Số luồng (Threads):</label>
                                <input type="number" class="form-control" th:field="*{threads}" />
                                <span class="error" th:if="${#fields.hasErrors('threads')}" th:errors="*{threads}"></span>
                            </div>
                        </div>
                        <div class="form-col">
                            <div class="form-group">
                                <label>Socket:</label>
                                <input type="text" class="form-control" th:field="*{socket}" />
                            </div>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-col">
                            <div class="form-group">
                                <label>Số lượng kho:</label>
                                <input type="number" class="form-control" th:field="*{stock}" />
                                <span class="error" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></span>
                            </div>
                        </div>
                        <div class="form-col">
                            <div class="form-group">
                                <label>Giá bán (VNĐ):</label>
                                <input type="number" class="form-control" th:field="*{price}" step="0.01" />
                                <span class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Mô tả ngắn gọn:</label>
                        <input type="text" class="form-control" th:field="*{description}" />
                    </div>

                    <div class="form-group">
                        <label>Hình ảnh minh họa:</label>
                        <input type="file" class="form-control" style="padding: 9px 15px;" id="imageInput" name="imageFiles" multiple="multiple" accept="image/*" />
                        <div id="previewContainer" style="display: flex; gap: 15px; margin-top: 15px; flex-wrap: wrap;"></div>
                    </div>

                    <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--admin-border);">
                        <button type="submit" class="btn-primary"><i class="fas fa-save"></i> Lưu Sản Phẩm</button>
                        <a th:href="@{/admin/cpu}" class="btn-secondary">Hủy bỏ</a>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/admin.js}"></script>
</body>
</html>
