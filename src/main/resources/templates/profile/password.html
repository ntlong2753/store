<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đổi mật khẩu - NexGen</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/profile.css}">
</head>
<body>
<th:block th:replace="~{profile/fragments/header :: header}"></th:block>

<div class="container">
    <!-- SIDEBAR TRÁI -->
    <th:block th:replace="~{profile/fragments/sidebar :: sidebar('password')}"></th:block>

    <!-- NỘI DUNG PHẢI -->
    <div class="content">
        <h2 class="page-title"><i class="fas fa-shield-alt"></i> Thay đổi mật khẩu</h2>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

        <!-- Form đổi mật khẩu ép độ rộng tối đa 500px cho thon gọn -->
        <form th:action="@{/profile/password}" method="post" style="max-width: 550px; margin: 40px auto 0;">
            <div class="form-group">
                <label>Mật khẩu cũ</label>
                <input type="password" name="oldPassword" class="form-control" required>
            </div>

            <div class="form-group">
                <label>Mật khẩu mới</label>
                <input type="password" name="newPassword" class="form-control" required>
            </div>

            <div class="form-group">
                <label>Xác nhận mật khẩu mới</label>
                <input type="password" name="confirmPassword" class="form-control" required>
            </div>

            <button type="submit" class="btn-save">Đổi mật khẩu</button>
        </form>
    </div>
</div>
</body>
</html>
