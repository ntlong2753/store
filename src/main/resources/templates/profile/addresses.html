<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sổ địa chỉ của tôi</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/profile.css}">
</head>
<body>
<th:block th:replace="~{profile/fragments/header :: header}"></th:block>

<div class="container">
    <!-- Cột trái: Sidebar điều hướng -->
    <th:block th:replace="~{profile/fragments/sidebar :: sidebar('addresses')}"></th:block>

    <!-- Cột phải: Nội dung chính -->
    <div class="content">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border-color); margin-bottom: 30px; padding-bottom: 20px;">
            <h2 class="page-title" style="border: none; margin: 0; padding: 0;"><i class="fas fa-map-marker-alt"></i> Sổ địa chỉ của tôi</h2>
            <button class="btn-save" onclick="toggleForm()" style="padding: 10px 20px; font-size: 14px;">
                <i class="fas fa-plus"></i> Thêm địa chỉ mới
            </button>
        </div>

        <!-- Báo lỗi hoặc thành công -->
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <!-- Form Thêm Mới (Được ẩn đi bằng CSS) -->
        <div id="addAddressForm">
            <form th:action="@{/profile/addresses/add}" method="post">
                <div style="display: flex; gap: 20px;">
                    <div class="form-group" style="flex: 1;">
                        <label>Họ và tên</label>
                        <input type="text" name="receiverName" class="form-control" placeholder="Tên người nhận hàng" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Số điện thoại</label>
                        <input type="text" name="phone" class="form-control" placeholder="Số điện thoại liên hệ" required>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 15px;">
                    <label>Địa chỉ cụ thể</label>
                    <textarea name="fullAddress" rows="3" class="form-control" placeholder="Số nhà, Tên đường, Phường/Xã, Quận/Huyện, Tỉnh/Thành phố..." required></textarea>
                </div>

                <div style="display: flex; align-items: center; gap: 8px;">
                    <input type="checkbox" id="isDefault" name="isDefault" value="true">
                    <label for="isDefault" style="font-size: 14px; cursor: pointer;">Đặt làm địa chỉ mặc định</label>
                </div>

                <div class="action-buttons" style="margin-top: 20px; padding-top: 20px; justify-content: flex-end;">
                    <button type="button" class="btn-cancel" onclick="toggleForm()">Hủy</button>
                    <button type="submit" class="btn-save">Hoàn thành</button>
                </div>
            </form>
        </div>

        <!-- Danh sách Địa Chỉ trống -->
        <div th:if="${addresses == null or addresses.isEmpty()}" style="text-align: center; padding: 40px; color: #666;">
            <i class="fas fa-map-marker-alt" style="font-size: 40px; color: #ddd; margin-bottom: 15px;"></i>
            <p>Bạn chưa có địa chỉ giao hàng nào.</p>
        </div>

        <!-- Vòng lặp hiển thị từng thẻ Địa Chỉ -->
        <div th:each="addr : ${addresses}" class="list-item" style="display: flex; justify-content: space-between; align-items: center;">

            <div class="address-info">
                <div class="address-header">
                    <span class="receiver-name" th:text="${addr.receiverName}">Nguyễn Văn A</span>
                    <span class="receiver-phone" th:text="${addr.phone}">0987654321</span>
                </div>
                <p class="full-address" th:text="${addr.fullAddress}">Số 123 Đường ABC</p>

                <div style="margin-top: 10px;" th:if="${addr.isDefault}">
                    <span class="badge-default" style="background: var(--primary); color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600;">Mặc định</span>
                </div>
            </div>

            <div class="address-actions" style="display: flex; gap: 10px; flex-direction: column; align-items: flex-end;">
                <!-- Nút Đặt Mặc Định (Vô hiệu hóa nếu đang là mặc định) -->
                <form th:action="@{/profile/addresses/default/{id}(id=${addr.id})}" method="post">
                    <button type="submit" class="btn-save" style="padding: 6px 12px; font-size: 12px; opacity: 1;" th:disabled="${addr.isDefault}" th:styleappend="${addr.isDefault ? 'opacity: 0.5; cursor: not-allowed;' : ''}">
                        Thiết lập mặc định
                    </button>
                </form>

                <div class="action-links">
                    <!-- Nút Xóa (Gửi POST request) -->
                    <form th:action="@{/profile/addresses/delete/{id}(id=${addr.id})}" method="post">
                        <button type="submit" class="btn-cancel" style="padding: 6px 12px; font-size: 12px;" onclick="return confirm('Bạn có chắc chắn muốn xóa địa chỉ này?');">Xóa</button>
                    </form>
                </div>
            </div>

        </div> <!-- Kết thúc vòng lặp -->

    </div>
</div>

<script th:src="@{/js/addresses.js}"></script>
</body>
</html>
