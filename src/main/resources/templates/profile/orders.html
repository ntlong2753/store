<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đơn hàng của tôi - NexGen</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/profile.css}">
    <style>
        .order-card {
            border: 1px solid #eee;
            border-radius: 8px;
            margin-bottom: 20px;
            padding: 15px;
            background: white;
        }
        .order-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .status-badge {
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            color: white;
        }
        .status-DELIVERED { background: #4caf50; }
        .status-REJECTED { background: #f44336; }
    </style>
</head>
<body>
<th:block th:replace="~{profile/fragments/header :: header}"></th:block>

<div class="container">
    <!-- SIDEBAR TRÁI -->
    <th:block th:replace="~{profile/fragments/sidebar :: sidebar('orders')}"></th:block>

    <!-- NỘI DUNG PHẢI -->
    <div class="content">
        <h2 class="page-title"><i class="fas fa-box-open"></i> Lịch sử mua hàng</h2>

        <div th:if="${#lists.isEmpty(orders)}" style="text-align: center; padding: 80px 0; color: #777;">
            <!-- Icon cái máy tính mờ mờ -->
            <i class="fas fa-desktop" style="font-size: 60px; color: #ddd; margin-bottom: 20px;"></i>
            <h3 style="font-weight: 400; margin: 0; font-size: 16px;">Chưa có lịch sử mua hàng nào.</h3>
        </div>

        <div th:if="${not #lists.isEmpty(orders)}">
            <div th:each="order : ${orders}" class="order-card">
                <div class="order-header">
                    <div>
                        <strong>Đơn hàng #<span th:text="${order.id}"></span></strong><br>
                        <span style="font-size: 12px; color: #777;" th:text="${#temporals.format(order.orderDate, 'dd-MM-yyyy HH:mm:ss')}"></span>
                    </div>
                    <div style="text-align: right;">
                        <span class="status-badge" th:classappend="'status-' + ${order.status}" th:text="${order.status.description}"></span>
                    </div>
                </div>

                <div>
                    <table style="width: 100%; border-collapse: collapse; margin-bottom: 15px;">
                        <tr th:each="item : ${order.items}" style="border-bottom: 1px dashed #eee;">
                            <td style="padding: 10px 0;">
                                <div style="display: flex; align-items: center;">
                                    <img th:if="${!#lists.isEmpty(item.product.images)}" th:src="@{${item.product.images[0].path}}" style="width: 50px; height: 50px; object-fit: cover; margin-right: 10px;">
                                    <div>
                                        <div th:text="${item.product.name}"></div>
                                        <div style="font-size: 13px; color: #888;">Số lượng: <span th:text="${item.quantity}"></span></div>
                                    </div>
                                </div>
                            </td>
                            <td style="text-align: right; font-weight: bold;" th:text="${#numbers.formatDecimal(item.price * item.quantity, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                        </tr>
                    </table>
                </div>

                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <strong>Người nhận:</strong> <span th:text="${order.receiverName}"></span> - <span th:text="${order.receiverPhone}"></span><br>
                        <strong>Địa chỉ:</strong> <span th:text="${order.shippingAddress}"></span>
                    </div>
                    <div style="text-align: right;">
                        <div style="font-size: 18px; color: #e30019; font-weight: bold;">
                            Tổng tiền: <span th:text="${#numbers.formatDecimal(order.totalPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
