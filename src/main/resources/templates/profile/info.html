<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hồ sơ của tôi</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
</head>
<body>

<div class="header-bar">
    <div style="font-weight: 700; font-size: 20px; color: #e30019;">Cửa hàng linh kiện</div>
    <a th:href="@{/}"><i class="fas fa-home"></i> Trở về Cửa hàng</a>
</div>

<div class="container">
    <!-- SIDEBAR TRÁI -->
    <div class="sidebar">
        <a th:href="@{/profile}" class="sidebar-item active">Thông tin tài khoản</a>
        <a th:href="@{/profile/orders}" class="sidebar-item">Thông tin đơn hàng</a>
        <a th:href="@{/profile/addresses}" class="sidebar-item">Các địa chỉ được lưu</a>
        <a th:href="@{/profile/password}" class="sidebar-item">Thay đổi mật khẩu</a>
    </div>

    <!-- NỘI DUNG PHẢI -->
    <div class="content">
        <h2 class="page-title"><i class="fas fa-user-circle"></i> Hồ sơ của tôi</h2>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

        <form th:action="@{/profile/update}" th:object="${user}" method="post" enctype="multipart/form-data">
            <div class="profile-layout">

                <!-- CỘT NHẬP THÔNG TIN (Trái) -->
                <div class="form-section">
                    <div class="form-group">
                        <label>Tên đăng nhập</label>
                        <!-- Tên đăng nhập LUÔN LUÔN không cho sửa -->
                        <input type="text" class="form-control" th:field="*{username}" readonly="readonly">
                    </div>

                    <div class="form-group">
                        <label>Họ và tên đầy đủ</label>
                        <!-- Đặt readonly làm mặc định -->
                        <input type="text" class="form-control editable-field" th:field="*{fullName}" required readonly="readonly">
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" class="form-control editable-field" th:field="*{email}" required readonly="readonly">
                    </div>

                    <div class="form-group">
                        <label>Số điện thoại</label>
                        <input type="text" class="form-control editable-field" th:field="*{phone}" required readonly="readonly">
                    </div>

                    <div class="action-buttons">
                        <!-- Nút sửa (hiện mặc định) -->
                        <button type="button" class="btn-edit" id="btnEditInfo">Chỉnh sửa thông tin</button>

                        <!-- Nút Lưu & Hủy (Bị giấu đi lúc đầu) -->
                        <button type="submit" class="btn-save hidden" id="btnSaveInfo">Lưu</button>
                        <button type="button" class="btn-cancel hidden" id="btnCancelInfo">Hủy</button>
                    </div>
                </div>

                <!-- CỘT ẢNH ĐẠI DIỆN (Phải) -->
                <div class="avatar-section">
                    <div class="avatar-wrapper">
                        <img id="avatarPreview" th:src="${user.userAvatar != null ? user.userAvatar.path : 'https://ui-avatars.com/api/?name=' + user.fullName + '&background=e30019&color=fff&size=180'}" class="avatar-circle" alt="Avatar">
                        
                        <!-- Nút Chọn ảnh mới (Bị giấu đi lúc đầu) -->
                        <div id="avatarUploadDiv" class="hidden">
                            <label class="avatar-upload-btn" title="Thay đổi ảnh đại diện">
                                <i class="fas fa-camera"></i>
                                <input type="file" name="avatarFile" class="file-input" id="avatarInput" accept="image/*">
                            </label>
                        </div>
                    </div>
                    <div style="color: var(--text-muted); font-size: 13px; font-weight: 500;">
                        Chỉ chấp nhận file ảnh (JPG, PNG).<br>Dung lượng tối đa 2MB.
                    </div>
                </div>
            </div>

            </div>
        </form>
    </div>
</div>

<script th:src="@{/js/profile.js}"></script>
</body>
</html>
