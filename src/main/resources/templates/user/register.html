<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng Ký - NexGen PC</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
            background: linear-gradient(to bottom right, rgba(0,0,0,0.7), rgba(0,0,0,0.4)),
                        url('https://images.unsplash.com/photo-1587202372775-e229f172b9d7?q=80&w=1920&auto=format&fit=crop') center/cover fixed;
            color: #333;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            width: 100%; max-width: 500px;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            position: relative;
            backdrop-filter: blur(10px);
            margin: 30px 0;
        }

        .back-home {
            position: absolute; top: -40px; left: 0;
            color: white; text-decoration: none; font-size: 15px; font-weight: 500;
            transition: 0.3s;
        }
        .back-home:hover { opacity: 0.8; }
        .back-home i { margin-right: 5px; }

        .logo { text-align: center; margin-bottom: 25px; }
        .logo h2 { font-size: 36px; font-weight: 800; margin: 0; color: #111; letter-spacing: -1px; }
        .logo h2 span { color: #e30019; }

        .form-header { text-align: center; margin-bottom: 30px; }
        .form-header h3 { font-size: 24px; color: #333; margin: 0 0 10px 0; }
        .form-header p { color: #666; font-size: 14px; margin: 0; }

        .form-group { margin-bottom: 20px; position: relative; }
        label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 8px; color: #444; }
        
        .input-icon {
            position: absolute; left: 15px; bottom: 14px;
            color: #999; font-size: 16px; transition: 0.3s;
        }
        input {
            width: 100%; padding: 14px 15px 14px 45px;
            border: 1px solid #ddd; border-radius: 8px;
            box-sizing: border-box; font-family: 'Roboto', sans-serif; font-size: 15px;
            transition: 0.3s; background: #fafafa;
        }
        input:focus { outline: none; border-color: #e30019; background: white; box-shadow: 0 0 0 3px rgba(227,0,25,0.1);}
        input:focus + .input-icon { color: #e30019; }
        
        .form-row { display: flex; gap: 15px; }
        .form-row .form-group { flex: 1; }

        .btn-submit {
            width: 100%; padding: 15px; background: linear-gradient(135deg, #e30019, #b90014);
            color: white; border: none; border-radius: 8px;
            font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.3s; margin-top: 10px;
            box-shadow: 0 4px 15px rgba(227,0,25,0.3);
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(227,0,25,0.4); }

        .links { text-align: center; margin-top: 25px; font-size: 15px; color: #666;}
        .links a { color: #e30019; text-decoration: none; font-weight: 700; transition: 0.2s;}
        .links a:hover { text-decoration: underline; }

        .alert { padding: 12px 15px; margin-bottom: 20px; border-radius: 8px; font-size: 14px; text-align: center; font-weight: 500;}
        .alert-error { background-color: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
        .text-danger { color: #e30019; font-size: 12px; margin-top: 5px; display: block; font-weight: 500;}
    </style>
</head>
<body>

<div class="login-card">
    <a th:href="@{/}" class="back-home"><i class="fas fa-arrow-left"></i> Quay lại trang chủ</a>
    
    <div class="logo">
        <h2>NexGen<span>.</span></h2>
    </div>

    <div class="form-header">
        <h3>Đăng ký tài khoản</h3>
        <p>Khởi tạo tài khoản để nhận đặc quyền từ NexGen PC</p>
    </div>

    <!-- Hiển thị lỗi tổng quát (nếu có) -->
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <form th:action="@{/register}" method="post" th:object="${user}">
        <div class="form-row">
            <div class="form-group">
                <label>Tên đăng nhập</label>
                <input type="text" th:field="*{username}" placeholder="4-20 ký tự" required>
                <i class="fas fa-user input-icon"></i>
                <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="text-danger"></span>
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" th:field="*{password}" placeholder="Tối thiểu 6 ký tự" required>
                <i class="fas fa-lock input-icon"></i>
                <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-danger"></span>
            </div>
        </div>

        <div class="form-group">
            <label>Họ và Tên</label>
            <input type="text" th:field="*{fullName}" placeholder="Ví dụ: Nguyễn Văn A" required>
            <i class="fas fa-id-card input-icon"></i>
            <span th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="text-danger"></span>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" th:field="*{email}" placeholder="Địa chỉ email hợp lệ" required>
            <i class="fas fa-envelope input-icon"></i>
            <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger"></span>
        </div>

        <div class="form-group">
            <label>Số điện thoại</label>
            <input type="text" th:field="*{phone}" placeholder="Nhập số điện thoại" required>
            <i class="fas fa-phone input-icon"></i>
            <span th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="text-danger"></span>
        </div>

        <button type="submit" class="btn-submit">ĐĂNG KÝ NGAY</button>
    </form>

    <div class="links">
        Đã có tài khoản? <a th:href="@{/login}">Đăng nhập tại đây</a>
    </div>
</div>

</body>
</html>
