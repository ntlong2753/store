<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng Ký - NexGen PC</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>

<div class="login-card register-card">
    <a th:href="@{/}" class="back-home"><i class="fas fa-arrow-left"></i> Quay lại trang chủ</a>
    
    <div class="logo">
        <h2>NexGen<span>.</span></h2>
    </div>

    <div class="form-header">
        <h3>Đăng ký tài khoản</h3>
        <p>Khởi tạo tài khoản để nhận đặc quyền từ NexGen PC</p>
    </div>

    <!-- Hiển thị lỗi tổng quát (nếu có) -->
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <form th:action="@{/register}" method="post" th:object="${user}">
        <div class="form-row">
            <div class="form-group">
                <label>Tên đăng nhập</label>
                <input type="text" th:field="*{username}" placeholder="4-20 ký tự" required>
                <i class="fas fa-user input-icon"></i>
                <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="text-danger"></span>
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" th:field="*{password}" placeholder="Tối thiểu 6 ký tự" required>
                <i class="fas fa-lock input-icon"></i>
                <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-danger"></span>
            </div>
        </div>

        <div class="form-group">
            <label>Họ và Tên</label>
            <input type="text" th:field="*{fullName}" placeholder="Ví dụ: Nguyễn Văn A" required>
            <i class="fas fa-id-card input-icon"></i>
            <span th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="text-danger"></span>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" th:field="*{email}" placeholder="Địa chỉ email hợp lệ" required>
            <i class="fas fa-envelope input-icon"></i>
            <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger"></span>
        </div>

        <div class="form-group">
            <label>Số điện thoại</label>
            <input type="text" th:field="*{phone}" placeholder="Nhập số điện thoại" required>
            <i class="fas fa-phone input-icon"></i>
            <span th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="text-danger"></span>
        </div>

        <button type="submit" class="btn-submit">ĐĂNG KÝ NGAY</button>
    </form>

    <div class="links">
        Đã có tài khoản? <a th:href="@{/login}">Đăng nhập tại đây</a>
    </div>
</div>

</body>
</html>
