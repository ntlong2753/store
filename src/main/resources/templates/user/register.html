<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng Ký - NexGen PC</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Roboto', sans-serif; margin: 0; padding: 0; display: flex; height: 100vh; color: #333; }

        /* CỘT TRÁI: ẢNH NỀN */
        .banner-side {
            width: 50%;
            background: linear-gradient(to right, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.2) 100%),
            url('https://images.unsplash.com/photo-1587202372634-32705e3bf49c?ixlib=rb-4.0.3&auto=format&fit=crop&w=1400&q=80') center/cover no-repeat;
            display: flex; align-items: center; padding: 50px;
        }
        .banner-text { color: white; max-width: 500px; }
        .banner-text h1 { font-size: 48px; line-height: 1.2; margin-bottom: 20px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5);}
        .banner-text h1 span { color: #e30019; }
        .banner-text p { font-size: 16px; line-height: 1.5; color: #e5e5e5; }

        /* CỘT PHẢI: FORM */
        .form-side { width: 50%; display: flex; justify-content: center; align-items: center; position: relative; background: white;}
        .form-container { width: 100%; max-width: 450px; padding: 20px 0; } /* Rộng hơn trang login một chút vì nhiều trường */

        .back-home { position: absolute; top: 30px; right: 40px; text-decoration: none; color: #555; font-size: 14px; font-weight: 500;}
        .back-home i { margin-right: 5px; }

        .form-header { margin-bottom: 25px; }
        .form-header h2 { font-size: 28px; color: #111; margin: 0 0 10px 0; }
        .form-header p { color: #777; font-size: 14px; margin: 0; }

        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 8px; color: #444; }
        input {
            width: 100%; padding: 12px 15px; border: 1px solid #ddd; border-radius: 6px;
            box-sizing: border-box; font-family: 'Roboto', sans-serif; font-size: 14px; transition: 0.2s; background: #fafafa;
        }
        input:focus { outline: none; border-color: #e30019; background: white; box-shadow: 0 0 0 3px rgba(227,0,25,0.1);}

        .error-msg { color: #e30019; font-size: 12px; margin-top: 5px; display: block; font-weight: 500; }

        .btn-submit {
            width: 100%; padding: 14px; background: #e30019; color: white; border: none;
            border-radius: 6px; font-size: 15px; font-weight: 700; cursor: pointer; transition: 0.2s; margin-top: 15px;
        }
        .btn-submit:hover { background: #c40015; }

        .links { text-align: center; margin-top: 20px; font-size: 14px; color: #666;}
        .links a { color: #e30019; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>

<div class="banner-side">
    <div class="banner-text">
        <h1>Xây dựng<br>cỗ máy trong mơ<br>cùng <span>NexGen.</span></h1>
        <p>Trải nghiệm mua sắm linh kiện PC đỉnh cao với hiệu năng vượt trội và dịch vụ chuyên nghiệp hàng đầu.</p>
    </div>
</div>

<div class="form-side">
    <a th:href="@{/}" class="back-home"><i class="fas fa-arrow-left"></i> Quay lại trang chủ</a>

    <div class="form-container">
        <div class="form-header">
            <h2>Đăng ký tài khoản</h2>
            <p>Khởi tạo tài khoản để tận hưởng các ưu đãi đặc quyền từ NexGen PC.</p>
        </div>

        <!--/*@thymesVar id="user" type="com.codegym.store.dto.UserRegisterDTO"*/-->
        <form th:action="@{/register}" th:object="${user}" method="post">
            <div class="form-group">
                <label>Tên đăng nhập</label>
                <input type="text" th:field="*{username}" placeholder="Viết liền không dấu (4-20 ký tự)">
                <span class="error-msg" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
            </div>

            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" th:field="*{password}" placeholder="Tối thiểu 6 ký tự">
                <span class="error-msg" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
            </div>

            <div class="form-group">
                <label>Họ và Tên</label>
                <input type="text" th:field="*{fullName}" placeholder="Ví dụ: Nguyễn Văn A">
                <span class="error-msg" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" th:field="*{email}" placeholder="Địa chỉ email hợp lệ">
                <span class="error-msg" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
            </div>

            <div class="form-group">
                <label>Số điện thoại</label>
                <input type="text" th:field="*{phone}" placeholder="Nhập số điện thoại (Viettel, Mobi, Vina)">
                <span class="error-msg" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
            </div>

            <button type="submit" class="btn-submit">Đăng ký ngay</button>
        </form>

        <div class="links">
            Đã có tài khoản? <a th:href="@{/login}">Đăng nhập tại đây</a>
        </div>
    </div>
</div>

</body>
</html>
