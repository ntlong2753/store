<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng Nhập - NexGen PC</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>

<div class="login-card">
    <a th:href="@{/}" class="back-home"><i class="fas fa-arrow-left"></i> Quay lại trang chủ</a>
    
    <div class="logo">
        <h2>NexGen<span>.</span></h2>
    </div>

    <div class="form-header">
        <h3>Đăng nhập hệ thống</h3>
        <p>Chào mừng bạn quay trở lại với NexGen PC</p>
    </div>

    <div th:if="${param.error}" class="alert alert-error">Tên đăng nhập hoặc mật khẩu không đúng!</div>
    <div th:if="${param.success}" class="alert alert-success">Đăng ký thành công! Vui lòng đăng nhập.</div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label>Tên đăng nhập</label>
            <input type="text" name="username" placeholder="Nhập tên đăng nhập" required>
            <i class="fas fa-user input-icon"></i>
        </div>
        <div class="form-group">
            <label>Mật khẩu</label>
            <input type="password" name="password" placeholder="Nhập mật khẩu" required>
            <i class="fas fa-lock input-icon"></i>
        </div>
        <button type="submit" class="btn-submit">ĐĂNG NHẬP</button>
    </form>

    <div class="links">
        Chưa có tài khoản? <a th:href="@{/register}">Đăng ký ngay</a>
    </div>
</div>

</body>
</html>
