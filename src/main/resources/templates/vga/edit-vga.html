<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{admin/fragments/head :: head('NexGen Admin - Chỉnh sửa vga')}"></head>
<body>

<!-- SIDEBAR BÊN TRÁI -->
<div th:replace="~{admin/fragments/sidebar :: sidebar('vga')}"></div>

<!-- KHU VỰC BÊN PHẢI -->
<div class="main-content">
  <!-- TOPBAR -->
  <div th:replace="~{admin/fragments/topbar :: topbar('Cập nhật Card màn hình (VGA)')}"></div>

  <div class="content-area">
    <div class="card">
      <div class="card-header">
        <h3 class="card-title">Chỉnh sửa thông số sản phẩm</h3>
        <a th:href="@{/admin/vga}" class="btn-secondary" style="padding: 8px 15px;"><i class="fas fa-arrow-left"></i> Quay lại</a>
      </div>

      <div class="card-body">
        <!-- FORM CHỈNH SỬA -->
        <form th:action="@{/admin/vga/edit}" th:object="${product}" method="post" enctype="multipart/form-data">

          <!-- Giữ lại ID ẩn -->
          <input type="hidden" th:field="*{id}" />

          <div class="form-group">
            <label>Tên vga (Tự động cập nhật theo dữ liệu bên dưới):</label>
            <input type="text" class="form-control" th:field="*{name}" readonly="readonly" id="name" />
          </div>

          <div class="form-row">
            <div class="form-col">
              <div class="form-group">
                <label>Hãng Card (Card Brand):</label>
                <input type="text" class="form-control" th:field="*{cardBrand}" id="cardBrand" placeholder="Ví dụ: ASUS, Gigabyte, MSI" />
                <span class="error" th:if="${#fields.hasErrors('cardBrand')}" th:errors="*{cardBrand}"></span>
              </div>
            </div>
            <div class="form-col">
              <div class="form-group">
                <label>Hãng GPU (GPU Brand):</label>
                <input type="text" class="form-control" th:field="*{gpuBrand}" id="gpuBrand" placeholder="Ví dụ: NVIDIA, AMD" />
                <span class="error" th:if="${#fields.hasErrors('gpuBrand')}" th:errors="*{gpuBrand}"></span>
              </div>
            </div>
          </div>

          <div class="form-row">
            <div class="form-col">
              <div class="form-group">
                <label>Mã model (GPU Model):</label>
                <input type="text" class="form-control" th:field="*{gpuModel}" id="gpuModel" placeholder="Ví dụ: RTX 4060" />
                <span class="error" th:if="${#fields.hasErrors('gpuModel')}" th:errors="*{gpuModel}"></span>
              </div>
            </div>
          </div>

          <div class="form-row">
            <div class="form-col">
              <div class="form-group">
                <label>Dung lượng VRAM (GB):</label>
                <input type="number" class="form-control" th:field="*{vram}" id="vram" placeholder="Ví dụ: 8" />
                <span class="error" th:if="${#fields.hasErrors('vram')}" th:errors="*{vram}"></span>
              </div>
            </div>
            <div class="form-col">
              <div class="form-group">
                <label>Loại VRAM (Memory Type):</label>
                <input type="text" class="form-control" th:field="*{memoryType}" id="memoryType" placeholder="Ví dụ: GDDR6" />
                <span class="error" th:if="${#fields.hasErrors('memoryType')}" th:errors="*{memoryType}"></span>
              </div>
            </div>
          </div>

          <div class="form-row">
            <div class="form-col">
              <div class="form-group">
                <label>Số lượng kho:</label>
                <input type="number" class="form-control" th:field="*{stock}" />
                <span class="error" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></span>
              </div>
            </div>
            <div class="form-col">
              <div class="form-group">
                <label>Giá bán (VNĐ):</label>
                <input type="number" class="form-control" th:field="*{price}" step="0.01" />
                <span class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span>
              </div>
            </div>
          </div>

          <div class="form-group">
            <label>Mô tả ngắn gọn:</label>
            <input type="text" class="form-control" th:field="*{description}" />
          </div>

          <!-- KHU VỰC ẢNH CŨ VÀ MỚI -->

          <input type="hidden" id="deletedImageIds" name="deletedImageIds" value="" />

          <div class="form-group">
            <label>Ảnh đang có sẵn (Bấm <i class="fas fa-times" style="color:red"></i> để xóa ảnh):</label>
            <div style="display: flex; gap: 15px; flex-wrap: wrap; background: #fafafa; padding: 15px; border-radius: 6px; border: 1px dashed var(--admin-border);">
              <div th:each="img : *{images}" th:id="'old-img-container-' + ${img.id}" style="position: relative; display: inline-block;">
                <img th:src="@{${img.path}}" style="width: 100px; height: 100px; object-fit: cover; border-radius: 6px; border: 1px solid #ebedf3; box-shadow: 0 2px 5px rgba(0,0,0,0.05);" />
                <button type="button" th:onclick="'deleteOldImage(' + ${img.id} + ')'"
                        style="position: absolute; top: -5px; right: -5px; background: #f64e60; color: white; border: none; border-radius: 50%; width: 24px; height: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 4px rgba(246,78,96,0.3);">
                  <i class="fas fa-times"></i>
                </button>
              </div>
              <span th:if="${#lists.isEmpty(product.images)}" style="color: #a2a3b7; font-size: 13px; font-style: italic; width: 100%; text-align: center; padding: 10px 0;">Sản phẩm này chưa có ảnh nào.</span>
            </div>
          </div>

          <div class="form-group">
            <label>Tải lên thêm ảnh mới:</label>
            <input type="file" class="form-control" style="padding: 9px 15px;" id="imageInput" name="imageFiles" multiple="multiple" accept="image/*" />
            <div id="previewContainer" style="display: flex; gap: 15px; margin-top: 15px; flex-wrap: wrap;"></div>
          </div>

          <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--admin-border);">
            <button type="submit" class="btn-primary"><i class="fas fa-save"></i> Cập Nhật Sản Phẩm</button>
            <a th:href="@{/admin/vga}" class="btn-secondary">Hủy bỏ</a>
          </div>

        </form>
      </div>
    </div>
  </div>
</div>

<script th:src="@{/js/admin.js}"></script>
</body>
</html>
