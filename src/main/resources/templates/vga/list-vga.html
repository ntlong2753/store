<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{admin/fragments/head :: head('NexGen Admin - Quản Lý vga')}"></head>
<body>

<!-- SIDEBAR BÊN TRÁI -->
<div th:replace="~{admin/fragments/sidebar :: sidebar('vga')}"></div>

<!-- KHU VỰC BÊN PHẢI -->
<div class="main-content">

    <div th:replace="~{admin/fragments/topbar :: topbar('Quản lý Vi xử lý (vga)')}"></div>

    <!-- KHU VỰC ĐỂ CÁI BẢNG -->
    <div class="content-area">
        <div class="card">

            <!-- TIÊU ĐỀ BẢNG VÀ NÚT THÊM MỚI -->
            <div class="card-header">
                <h3 class="card-title">Danh sách vga trong kho</h3>
                <a th:href="@{/admin/vga/add}" class="btn-add">
                    <i class="fas fa-plus"></i> Thêm vga Mới
                </a>
            </div>

            <div class="card-body">

                <!-- 1. Báo rỗng nếu Danh sách rỗng (Chưa có sản phẩm nào) -->
                <div class="empty-state" th:if="${vgas.isEmpty()}">
                    <i class="fas fa-box-open"></i>
                    <h3>Kho vga đang trống</h3>
                    <p>Chưa có sản phẩm nào trong cơ sở dữ liệu. Hãy bấm "Thêm vga Mới"!</p>
                </div>

                <!-- 2. Bảng Dữ liệu (Nếu có sản phẩm thì hiện bảng này) -->
                <div class="table-responsive" th:unless="${vgas.isEmpty()}">
                    <table>
                        <thead>
                        <tr>
                            <th style="width: 50px; text-align: center;">STT</th>
                            <th style="width: 350px;">Sản phẩm</th>
                            <th>Thông số chính</th>
                            <th>Trạng thái kho</th>
                            <th>Giá bán</th>
                            <th style="width: 120px; text-align: center;">Hành động</th>
                        </tr>
                        </thead>
                        <tbody>
                        <!-- Lặp từng vga trong biến 'vgas' -->
                        <tr th:each="vga, iter : ${vgas}">

                            <!-- Cột STT -->
                            <td style="text-align: center; font-weight: bold;" th:text="${iter.count}">1</td>

                            <!-- Cột Hình ảnh + Tên -->
                            <td>
                                <div style="display: flex; align-items: center; gap: 15px;">
                                    <!-- Hình ảnh -->
                                    <img th:if="${!#lists.isEmpty(vga.images)}" th:src="@{${vga.images[0].path}}" class="product-img" alt="img" />
                                    <div th:if="${#lists.isEmpty(vga.images)}" class="no-img">No Img</div>

                                    <!-- Tên và hãng -->
                                    <div>
                                        <span class="product-name" th:text="${vga.name}">Tên VGA</span>
                                        <span class="product-brand" th:text="${vga.cardBrand} + ' | GPU: ' + ${vga.gpuBrand}">Hãng Card</span>
                                    </div>
                                </div>
                            </td>

                            <!-- Cột Thông số -->
                            <td>
                                <div style="font-size: 12px; color: #7e8299;">
                                    <div>Model GPU: <strong style="color: #3f4254;" th:text="${vga.gpuModel}">...</strong></div>
                                    <div>VRAM: <strong style="color: #3f4254;" th:text="${vga.vram} + ' GB'">...</strong></div>
                                    <div>Loại bộ nhớ: <strong style="color: #3f4254;" th:text="${vga.memoryType}">...</strong></div>
                                </div>
                            </td>

                            <!-- Cột Số lượng (Kho) -->
                            <td>
                                <span class="badge badge-success" th:if="${vga.stock > 0}" th:text="'Còn ' + ${vga.stock} + ' cái'">Còn hàng</span>
                                <span class="badge badge-danger" th:if="${vga.stock <= 0}">Hết hàng</span>
                            </td>

                            <!-- Cột Giá tiền -->
                            <td class="price" th:text="${#numbers.formatDecimal(vga.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                                0 đ
                            </td>

                            <!-- Cột Hành động (Sửa / Xóa) -->
                            <td>
                                <div class="action-btns">
                                    <!-- Nút Sửa -->
                                    <a th:href="@{/admin/vga/edit/{id}(id=${vga.id})}" class="btn-icon btn-edit" title="Chỉnh sửa vga">
                                        <i class="fas fa-pen"></i>
                                    </a>
                                    <!-- Nút Xóa -->
                                    <a th:href="@{/admin/vga/delete/{id}(id=${vga.id})}"
                                       onclick="return confirm('CẢNH BÁO: Bạn có chắc chắn muốn xóa linh kiện này khỏi hệ thống không?')"
                                       class="btn-icon btn-delete" title="Xóa vga">
                                        <i class="fas fa-trash"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

            </div> <!-- Hết card-body -->

            <!-- KHU VỰC CHUYỂN TRANG -->
            <div th:replace="~{admin/fragments/pagination :: pagination(vgas, '/admin/vga')}"></div>
        </div> <!-- Hết card -->
    </div> <!-- Hết content-area -->

</div> <!-- Hết main-content -->

</body>
</html>
