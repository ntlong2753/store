<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{admin/fragments/head :: head('NexGen Admin - Thêm Nguồn Mới')}"></head>
<body>

<!-- SIDEBAR BÊN TRÁI -->
<div th:replace="~{admin/fragments/sidebar :: sidebar('psu')}"></div>

<!-- KHU VỰC BÊN PHẢI -->
<div class="main-content">
    <div th:replace="~{admin/fragments/topbar :: topbar('Thêm Nguồn Mới')}"></div>

    <div class="content-area">
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Nhập thông số Nguồn</h3>
                <a th:href="@{/admin/psu}" class="btn-secondary" style="padding: 8px 15px;"><i class="fas fa-arrow-left"></i> Quay lại</a>
            </div>

            <div class="card-body">
                <form th:action="@{/admin/psu/add}" th:object="${product}" method="post" enctype="multipart/form-data">

                    <div class="form-group">
                        <label>Tên PSU (*):</label>
                        <input type="text" class="form-control" th:field="*{name}" placeholder="Tự sinh, có thể sửa" />
                        <span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
                    </div>

                    <div class="form-group">
                        <label>Hãng (*):</label>
                        <input type="text" class="form-control" th:field="*{brand}" placeholder="Ví dụ: Corsair, Cooler Master, MSI" />
                        <span class="error" th:if="${#fields.hasErrors('brand')}" th:errors="*{brand}"></span>
                    </div>

                    <div class="form-group">
                        <label>Công suất (W) (*):</label>
                        <input type="number" class="form-control" th:field="*{wattage}" placeholder="Ví dụ: 550, 650, 750, 850, 1000" />
                        <span class="error" th:if="${#fields.hasErrors('wattage')}" th:errors="*{wattage}"></span>
                    </div>

                    <div class="form-group">
                        <label>Chuẩn nguồn (*):</label>
                        <input type="text" class="form-control" th:field="*{formFactor}" placeholder="Ví dụ: 80 Plus Bronze, 80 Plus Gold" />
                        <span class="error" th:if="${#fields.hasErrors('formFactor')}" th:errors="*{formFactor}"></span>
                    </div>
                    
                    <div class="form-group">
                        <label>Kích thước (*):</label>
                        <input type="text" class="form-control" th:field="*{size}" placeholder="Ví dụ: ATX, SFX, SFX-L" />
                        <span class="error" th:if="${#fields.hasErrors('size')}" th:errors="*{size}"></span>
                    </div>

                    <div class="form-row">
                        <div class="form-col">
                            <div class="form-group">
                                <label>Số lượng kho:</label>
                                <input type="number" class="form-control" th:field="*{stock}" />
                                <span class="error" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></span>
                            </div>
                        </div>
                        <div class="form-col">
                            <div class="form-group">
                                <label>Giá bán (VNĐ):</label>
                                <input type="number" class="form-control" th:field="*{price}" step="0.01" />
                                <span class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Mô tả ngắn gọn:</label>
                        <input type="text" class="form-control" th:field="*{description}" />
                    </div>

                    <div class="form-group">
                        <label>Hình ảnh minh họa:</label>
                        <input type="file" class="form-control" style="padding: 9px 15px;" id="imageInput" name="imageFiles" multiple="multiple" accept="image/*" />
                        <div id="previewContainer" style="display: flex; gap: 15px; margin-top: 15px; flex-wrap: wrap;"></div>
                    </div>

                    <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--admin-border);">
                        <button type="submit" class="btn-primary"><i class="fas fa-save"></i> Lưu Sản Phẩm</button>
                        <a th:href="@{/admin/psu}" class="btn-secondary">Hủy bỏ</a>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/admin.js}"></script>
</body>
</html>
