<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Giỏ hàng của bạn</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    
    <th:block th:replace="~{store/fragments/header :: header-css}"></th:block>
</head>
<body>

<div th:replace="~{store/fragments/header :: header-body}"></div>

<div class="container">
    <h2 class="cart-title"><i class="fas fa-shopping-cart" style="color: var(--primary-red);"></i> Giỏ hàng của bạn</h2>

    <div class="cart-box">
        <!-- Nếu giỏ trống -->
        <div th:if="${cart == null or #lists.isEmpty(cart.items)}" class="empty-cart">
            <i class="fas fa-box-open"></i>
            <h3>Chưa có sản phẩm nào trong giỏ hàng của bạn.</h3>
            <a th:href="@{/}" class="btn-continue"><i class="fas fa-arrow-left"></i> Tiếp tục mua sắm</a>
        </div>

        <!-- Nếu có đồ -->
        <div th:if="${cart != null and !#lists.isEmpty(cart.items)}">
            <table>
                <thead>
                <tr>
                    <th style="width: 5%;">STT</th>
                    <th style="width: 45%;">Sản phẩm</th>
                    <th style="width: 15%;">Đơn giá</th>
                    <th style="width: 15%; text-align: center;">Số lượng</th>
                    <th style="width: 15%; text-align: right;">Thành tiền</th>
                    <th style="width: 5%; text-align: center;">Xóa</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item, stat : ${cart.items}">
                    <td th:text="${stat.count}">1</td>
                    <td>
                        <div class="product-col">
                            <!-- Đường dẫn tĩnh đã có sẵn dấu / từ db -->
                            <img th:if="${!#lists.isEmpty(item.product.images)}" th:src="@{${item.product.images[0].path}}">
                            <img th:if="${#lists.isEmpty(item.product.images)}" src="https://via.placeholder.com/90x90?text=No+Image">
                            <div class="info">
                                <a th:href="@{'/product/' + ${item.product.id}}" class="name" th:text="${item.product.name}" target="_blank">Tên SP</a>
                                <div class="stock"><i class="fas fa-check-circle"></i> <span th:text="'Còn: ' + ${item.product.stock}">Còn: 25</span></div>
                            </div>
                        </div>
                    </td>
                    <!-- Giá 1 sản phẩm -->
                    <td class="price" th:text="${#numbers.formatDecimal(item.product.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">11,490,000 đ</td>

                    <!-- Số lượng mua (Sử dụng nút + -) -->
                    <td style="text-align: center;">
                        <form th:action="@{/cart/update}" method="post" style="margin: 0;">
                            <input type="hidden" name="itemId" th:value="${item.id}" />
                            <div class="qty-wrapper">
                                <button type="button" class="btn-qty btn-quantity" data-action="decrease">-</button>
                                <input type="number" name="quantity" class="qty-input quantity-input" th:value="${item.quantity}" min="1" th:max="${item.product.stock}" readonly>
                                <button type="button" class="btn-qty btn-quantity" data-action="increase">+</button>
                            </div>
                        </form>
                    </td>

                    <!-- Tính thành tiền (Đơn giá * Số lượng) -->
                    <td class="total-price" style="text-align: right;" th:text="${#numbers.formatDecimal(item.product.price * item.quantity, 0, 'COMMA', 0, 'POINT')} + ' đ'">11,490,000 đ</td>

                    <!-- Nút xóa -->
                    <td style="text-align: center;">
                        <form th:action="@{/cart/remove/{itemId}(itemId=${item.id})}" method="post" style="margin: 0;">
                            <button type="submit" class="btn-delete" title="Xóa" onclick="return confirm('Bạn muốn xóa sản phẩm này khỏi giỏ hàng?')"><i class="far fa-trash-alt"></i></button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>

            <div class="cart-footer">
                <div></div>
                <div class="total-section">
                    <span class="label">Tổng tiền thanh toán:</span>
                    <span th:text="${#numbers.formatDecimal(cart.totalPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</span>
                </div>
            </div>
            <div class="action-row">
                <a th:href="@{/}" class="btn-continue"><i class="fas fa-arrow-left"></i> Tiếp tục mua sắm</a>
                <a th:href="@{/checkout}" class="btn-checkout">Thanh toán đơn hàng <i class="fas fa-arrow-right"></i></a>
            </div>
        </div>
    </div>
</div>



<!-- Nhúng Script chung của Header (Tìm kiếm Ajax) -->
<th:block th:replace="~{store/fragments/header :: header-js}"></th:block>

</body>
</html>
