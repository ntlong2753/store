<style>
    /* Card Sản Phẩm */
    .product-card {
        background: white;
        border-radius: 8px;
        padding: 15px;
        display: flex;
        flex-direction: column;
        position: relative;
        border: 1px solid #e5e5e5;
        box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        transition: 0.2s;
    }
    .product-card:hover { border-color: var(--primary-red); box-shadow: 0 6px 16px rgba(0,0,0,0.08); transform: translateY(-3px); }

    .badge-brand {
        position: absolute; top: 10px; right: 10px;
        background: var(--primary-red); color: white;
        font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 2px;
    }
    .product-img { width: 100%; height: 160px; object-fit: contain; margin-bottom: 15px; transition: 0.3s; }
    .product-card:hover .product-img { transform: scale(1.05); }
    .brand-text { font-size: 12px; color: var(--text-gray); margin-bottom: 5px; text-transform: uppercase; }
    .product-name { font-size: 14px; font-weight: 500; color: var(--text-dark); line-height: 1.4; margin: 0 0 15px 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; height: 40px; }
    .price-row { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 15px; margin-top: auto;}
    .price { font-size: 16px; font-weight: 700; color: var(--primary-red); }
    .stock-status { font-size: 11px; color: #00a651; font-weight: 500; }
    .card-actions { display: flex; gap: 8px; }
    .btn-detail { flex: 1; background: white; color: var(--primary-red); border: 1px solid var(--primary-red); border-radius: 4px; padding: 8px 0; font-size: 13px; font-weight: 500; cursor: pointer; transition: 0.2s; text-decoration: none; text-align: center; box-sizing: border-box; display: inline-block; }
    .btn-detail:hover { background: #fff5f5; }
    .btn-add-cart { flex: 1; background: var(--primary-red); color: white; border: none; border-radius: 4px; padding: 8px 0; font-size: 13px; font-weight: 500; cursor: pointer; transition: 0.2s; width: 100%; }
    .btn-add-cart:hover { background: #c40015; }

    .pagination-wrapper { grid-column: 1 / -1; display: flex; justify-content: center; margin-top: 30px; gap: 5px; }
    .page-link { padding: 8px 15px; background: white; border: 1px solid #ddd; color: #333; text-decoration: none; border-radius: 4px; transition: 0.2s; font-size: 14px; }
    .page-link:hover { background: #f5f5f5; border-color: #ccc; }
    .page-link.active { background: var(--primary-red); color: white; border-color: var(--primary-red); }
    .page-link.disabled { color: #aaa; pointer-events: none; background: #fafafa; border-color: #eee; }
</style>

<!-- Bọc toàn bộ bằng 1 thẻ div có id để AJAX có thể thay thế -->
<div id="ajax-product-list" xmlns:th="http://www.thymeleaf.org">

    <div class="product-grid" id="productGrid" style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px;">
        <!-- NẾU TRỐNG -->
        <div th:if="${#lists.isEmpty(cpus)}" style="grid-column: 1 / -1; text-align: center; padding: 50px 0; color: #777;">
            Không tìm thấy sản phẩm nào!
        </div>

        <!-- Vòng lặp hiển thị linh kiện -->
        <div class="product-card" th:each="cpu : ${cpus}">

            <!-- Nhận diện tên class để biết đây là loại linh kiện gì -->
            <span class="badge-brand" th:text="${cpu.class.simpleName}">Loại LK</span>

            <!-- Ảnh sản phẩm -->
            <img class="product-img"
                 th:if="${!#lists.isEmpty(cpu.images)}"
                 th:src="@{${cpu.images[0].path}}"
                 alt="Product Image">
            <img class="product-img"
                 th:if="${#lists.isEmpty(cpu.images)}"
                 src="https://via.placeholder.com/150x150?text=No+Image"
                 alt="No Image">

            <!-- Hiển thị Hãng sản xuất hoặc Series tùy theo loại linh kiện -->
            <div class="brand-text" th:if="${cpu.class.simpleName == 'Cpu'}" th:text="${cpu.series}">...</div>
            <div class="brand-text" th:if="${cpu.class.simpleName == 'Ram'}" th:text="${cpu.brand}">...</div>
            <div class="brand-text" th:if="${cpu.class.simpleName == 'Vga'}" th:text="${cpu.cardBrand}">...</div>
            <div class="brand-text" th:if="${cpu.class.simpleName == 'Mainboard'}" th:text="${cpu.brand}">...</div>
            <div class="brand-text" th:if="${cpu.class.simpleName == 'Casepc'}" th:text="${cpu.brand}">...</div>
            <div class="brand-text" th:if="${cpu.class.simpleName == 'Psu'}" th:text="${cpu.brand}">...</div>


            <!-- Tên sản phẩm -->
            <h4 class="product-name" th:text="${cpu.name}">Tên sản phẩm</h4>

            <!-- Giá và Trạng thái -->
            <div class="price-row">
                <span class="price" th:text="${#numbers.formatDecimal(cpu.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0 ₫</span>
                <span class="stock-status" th:if="${cpu.stock > 0}">Còn hàng</span>
                <span class="stock-status" th:if="${cpu.stock <= 0}" style="color: #e30019;">Hết hàng</span>
            </div>

            <!-- Các Nút Thao Tác -->
            <div class="card-actions">
                <a th:href="@{/product/{id}(id=${cpu.id})}" class="btn-detail" style="text-decoration: none; text-align: center; box-sizing: border-box; display: inline-block;">Chi tiết</a>

                <form th:if="${!isAdmin}" th:action="@{/cart/add}" method="post" class="form-add-cart" style="margin: 0; flex: 1;">
                    <input type="hidden" name="productId" th:value="${cpu.id}" />
                    <input type="hidden" name="quantity" value="1" />
                    <button type="submit" class="btn-add-cart" style="width: 100%;">Thêm vào</button>
                </form>
            </div>
        </div>
    </div>

    <!-- KHỐI PHÂN TRANG -->
    <div class="pagination" th:if="${totalPages > 1}" style="display: flex; justify-content: center; gap: 10px; margin-top: 30px; width: 100%;">

        <a th:href="@{/(cat=${param.cat}, page=${currentPage - 1})}"
           th:if="${currentPage > 0}"
           style="padding: 8px 15px; border: 1px solid #e30019; color: #e30019; text-decoration: none; border-radius: 4px; font-weight: 500;">
            <i class="fas fa-chevron-left"></i> Trước
        </a>

        <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
            <a th:href="@{/(cat=${param.cat}, page=${i})}"
               th:text="${i + 1}"
               th:style="${i == currentPage} ? 'background: #e30019; color: white; padding: 8px 15px; border: 1px solid #e30019; text-decoration: none; border-radius: 4px; font-weight: 500;' : 'padding: 8px 15px; border: 1px solid #e30019; color: #e30019; text-decoration: none; border-radius: 4px; font-weight: 500;'">
            </a>
        </span>

        <a th:href="@{/(cat=${param.cat}, page=${currentPage + 1})}"
           th:if="${currentPage < totalPages - 1}"
           style="padding: 8px 15px; border: 1px solid #e30019; color: #e30019; text-decoration: none; border-radius: 4px; font-weight: 500;">
            Sau <i class="fas fa-chevron-right"></i>
        </a>
    </div>

</div>
