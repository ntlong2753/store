<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- HEAD CSS cho Header -->
<th:block th:fragment="header-css">
    <link rel="stylesheet" th:href="@{/css/store.css}">
</th:block>

<!-- HEADER BODY -->
<header th:fragment="header-body">
    <div class="header-container">
        <!-- Logo -->
        <a th:href="@{/}" class="logo">NexGen PC</a>

        <!-- Cây tìm kiếm -->
        <form class="search-bar" action="/search" method="get">
            <input type="text" name="keyword" id="searchInput" placeholder="Bạn cần tìm linh kiện gì (tên, mã, hãng)..." th:value="${param.keyword}">
            <button type="submit"><i class="fas fa-search"></i></button>
        </form>

        <!-- Cụm Các Nút Chức Năng -->
        <div class="header-actions">

            <!-- 1. Nút Trang chủ -->
            <a th:href="@{/}" class="action-item">
                <i class="fas fa-home"></i>
                <div class="text-group">
                    <span class="text-single">Trang chủ</span>
                </div>
            </a>

            <!-- 2. Tra cứu đơn hàng (Ẩn với Admin) -->
            <a th:href="@{/orders}" class="action-item" th:if="${isAdmin != true}">
                <i class="far fa-file-alt"></i>
                <div class="text-group">
                    <span class="text-top">Tra cứu</span>
                    <span class="text-bottom">đơn hàng</span>
                </div>
            </a>

            <!-- 3. Giỏ hàng siêu đẹp (Ẩn với Admin) -->
            <a th:href="@{/cart}" class="action-item" th:if="${isAdmin != true}">
                <div class="icon-wrapper">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count" th:text="${cartCount != null ? cartCount : 0}">0</span>
                </div>
                <div class="text-group">
                    <span class="text-top">Giỏ</span>
                    <span class="text-bottom">hàng</span>
                </div>
            </a>

            <!-- 4. Nút Trang Admin (Chỉ hiện khi là ADMIN) -->
            <a th:href="@{/admin}" class="action-item" th:if="${isAdmin == true}" style="background: rgba(255,255,255,0.2) !important; padding: 5px 15px !important; border-radius: 6px;">
                <i class="fas fa-cogs"></i>
                <div class="text-group">
                    <span class="text-single">Trang Admin</span>
                </div>
            </a>

            <!-- 5. Nút Tài khoản & Menu -->
            <div class="account-menu">
                <div class="action-item" style="background: #c40015 !important; padding: 8px 15px !important; border-radius: 6px;">
                    <!-- Ảnh đại diện -->
                    <img th:if="${globalAvatar != null}" th:src="@{${globalAvatar}}" class="header-avatar" alt="Avatar" style="width: 30px; height: 30px; border-radius: 50%; object-fit: cover; border: 1px solid white;">
                    <i th:if="${globalAvatar == null}" class="fas fa-user"></i>

                    <div class="text-group">
                        <span class="text-single" th:text="${username != null ? username : 'Tài khoản'}">Tài khoản</span>
                    </div>
                    <i class="fas fa-caret-down" style="font-size: 14px; margin-left: 5px;"></i>
                </div>

                <!-- Dropdown cho KHÁCH -->
                <div class="account-dropdown" th:if="${username == null}">
                    <a th:href="@{/login}"><i class="fas fa-sign-in-alt" style="color:#007bff;"></i> Đăng nhập</a>
                    <a th:href="@{/register}"><i class="fas fa-user-plus" style="color:#10b981;"></i> Đăng ký tài khoản</a>
                </div>

                <!-- Dropdown cho NGƯỜI ĐÃ ĐĂNG NHẬP -->
                <div class="account-dropdown" th:if="${username != null}">
                    <a th:href="@{/profile}"><i class="fas fa-user-circle" style="color:#333;"></i> Hồ sơ của tôi</a>
                    <form th:action="@{/logout}" method="post" style="margin: 0;">
                        <button type="submit" style="width: 100%; text-align: left; background: transparent; border: none; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 12px 20px; color: #333;">
                            <i class="fas fa-sign-out-alt" style="color: #e30019; width: 20px; text-align: center;"></i> Đăng xuất
                        </button>
                    </form>
                </div>
            </div>

        </div>
    </div>
</header>

<!-- JS cho Header (Tìm kiếm Ajax) -->
<th:block th:fragment="header-js">
    <script th:src="@{/js/store.js}"></script>
</th:block>

</body>
</html>
