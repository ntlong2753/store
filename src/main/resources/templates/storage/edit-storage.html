<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{admin/fragments/head :: head('NexGen Admin - Chỉnh sửa storage')}"></head>
<body>

<!-- SIDEBAR BÊN TRÁI -->
<div th:replace="~{admin/fragments/sidebar :: sidebar('storage')}"></div>

<!-- KHU VỰC BÊN PHẢI -->
<div class="main-content">
  <!-- TOPBAR -->
  <div th:replace="~{admin/fragments/topbar :: topbar('Cập nhật Ổ cứng (Storage)')}"></div>

  <div class="content-area">
    <div class="card">
      <div class="card-header">
        <h3 class="card-title">Chỉnh sửa thông số sản phẩm</h3>
        <a th:href="@{/admin/storage}" class="btn-secondary" style="padding: 8px 15px;"><i class="fas fa-arrow-left"></i> Quay lại</a>
      </div>

      <div class="card-body">
        <!-- FORM CHỈNH SỬA -->
        <form th:action="@{/admin/storage/edit}" th:object="${product}" method="post" enctype="multipart/form-data">

          <!-- Giữ lại ID ẩn -->
          <input type="hidden" th:field="*{id}" />

                    <div class="form-group">
                        <label>Loại ổ cứng:</label>
                        <select class="form-control" th:field="*{storageType}" id="storageType">
                            <option value="SSD">SSD (Ổ cứng thể rắn)</option>
                            <option value="HDD">HDD (Ổ cứng cơ)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Tên ổ cứng (*):</label>
                        <input type="text" class="form-control" th:field="*{name}" id="name" placeholder="Ví dụ: Ổ cứng SSD Samsung 980 Pro 1TB" />
                        <span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
                    </div>

                    <div class="form-row">
                        <div class="form-col">
                            <div class="form-group">
                                <label>Hãng (*):</label>
                                <input type="text" class="form-control" th:field="*{brand}" placeholder="Ví dụ: Samsung, WD, Seagate" />
                            </div>
                        </div>
                        <div class="form-col">
                            <div class="form-group">
                                <label>Dung lượng (*):</label>
                                <div style="display: flex; gap: 10px;">
                                    <input type="text" class="form-control" th:field="*{capacity}" placeholder="Ví dụ: 1, 500" style="flex: 1;" />
                                    <!-- In edit form, capacity is stored as a String so maybe just one field, but controller can parse if we submit capacityUnit.
                                         Wait, earlier I changed Storage to just use a single capacity string?
                                         Let me recall what I wrote for Storage capacity in the plan.
                                         Ah, I wrote "gộp thành một chuỗi thay vì tách riêng số lượng và đơn vị đo"
                                         Let me check `Storage.java` to see what I actually generated. -->
                                    <input type="text" class="form-control" name="capacityUnit" placeholder="TB / GB" style="width: 80px;" />
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- THÔNG SỐ SSD -->
                    <div id="ssd-section" style="background: #f8fbff; border-left: 4px solid var(--admin-accent); padding: 15px; border-radius: 4px; margin-bottom: 20px;">
                        <h4 style="margin-top: 0; color: #3f4254; font-size: 16px;">Thông số SSD</h4>
                        <div class="form-group">
                            <label>Chuẩn kết nối:</label>
                            <input type="text" class="form-control" th:field="*{connectionStandard}" placeholder="Ví dụ: M.2 NVMe, SATA 3" />
                        </div>
                        <div class="form-group">
                            <label>Chuẩn PCIe (nếu NVMe):</label>
                            <input type="text" class="form-control" th:field="*{pcieStandard}" placeholder="Ví dụ: PCIe 4.0 x4" />
                        </div>
                        <div class="form-row">
                            <div class="form-col">
                                <div class="form-group">
                                    <label>Tốc độ đọc (MB/s):</label>
                                    <input type="number" class="form-control" th:field="*{readSpeed}" placeholder="Ví dụ: 7000" />
                                </div>
                            </div>
                            <div class="form-col">
                                <div class="form-group">
                                    <label>Tốc độ ghi (MB/s):</label>
                                    <input type="number" class="form-control" th:field="*{writeSpeed}" placeholder="Ví dụ: 5000" />
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- THÔNG SỐ HDD -->
                    <div id="hdd-section" style="background: #fffdf5; border-left: 4px solid #ffa800; padding: 15px; border-radius: 4px; margin-bottom: 20px; display: none;">
                        <h4 style="margin-top: 0; color: #3f4254; font-size: 16px;">Thông số HDD</h4>
                        <div class="form-group">
                            <label>Tốc độ vòng quay (RPM):</label>
                            <input type="text" class="form-control" th:field="*{rpm}" placeholder="Ví dụ: 7200, 5400" />
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Bộ nhớ đệm (Cache):</label>
                        <div style="display: flex; gap: 10px;">
                            <input type="number" class="form-control" th:field="*{cache}" placeholder="Ví dụ: 256" style="flex: 1;" />
                            <select class="form-control" style="width: 80px;" disabled>
                                <option>MB</option>
                            </select>
                        </div>
                    </div>

          <div class="form-row">
            <div class="form-col">
              <div class="form-group">
                <label>Số lượng kho:</label>
                <input type="number" class="form-control" th:field="*{stock}" />
                <span class="error" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></span>
              </div>
            </div>
            <div class="form-col">
              <div class="form-group">
                <label>Giá bán (VNĐ):</label>
                <input type="number" class="form-control" th:field="*{price}" step="0.01" />
                <span class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span>
              </div>
            </div>
          </div>

          <div class="form-group">
            <label>Mô tả ngắn gọn:</label>
            <input type="text" class="form-control" th:field="*{description}" />
          </div>

          <!-- KHU VỰC ẢNH CŨ VÀ MỚI -->


          <div class="form-group">
            <label>Ảnh đang có sẵn (Bấm <i class="fas fa-times" style="color:red"></i> để xóa ảnh):</label>
            <div style="display: flex; gap: 15px; flex-wrap: wrap; background: #fafafa; padding: 15px; border-radius: 6px; border: 1px dashed var(--admin-border);">
              <div th:each="img : *{images}" th:id="'old-img-container-' + ${img.id}" style="position: relative; display: inline-block;">
                <img th:src="@{${img.path}}" style="width: 100px; height: 100px; object-fit: cover; border-radius: 6px; border: 1px solid #ebedf3; box-shadow: 0 2px 5px rgba(0,0,0,0.05);" />
                <button type="button" th:onclick="'deleteOldImage(' + ${img.id} + ')'"
                        style="position: absolute; top: -5px; right: -5px; background: #f64e60; color: white; border: none; border-radius: 50%; width: 24px; height: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 4px rgba(246,78,96,0.3);">
                  <i class="fas fa-times"></i>
                </button>
              </div>
              <span th:if="${#lists.isEmpty(product.images)}" style="color: #a2a3b7; font-size: 13px; font-style: italic; width: 100%; text-align: center; padding: 10px 0;">Sản phẩm này chưa có ảnh nào.</span>
            </div>
          </div>

          <div class="form-group">
            <label>Tải lên thêm ảnh mới:</label>
            <input type="file" class="form-control" style="padding: 9px 15px;" id="imageInput" name="imageFiles" multiple="multiple" accept="image/*" />
            <div id="previewContainer" style="display: flex; gap: 15px; margin-top: 15px; flex-wrap: wrap;"></div>
          </div>

          <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--admin-border);">
            <button type="submit" class="btn-primary"><i class="fas fa-save"></i> Cập Nhật Sản Phẩm</button>
            <a th:href="@{/admin/storage}" class="btn-secondary">Hủy bỏ</a>
          </div>

        </form>
      </div>
    </div>
  </div>
</div>

<script th:src="@{/js/admin.js}"></script>
</body>
</html>
