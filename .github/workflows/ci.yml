name: CI - Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root@123
          MYSQL_DATABASE: store
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle' # 👈 Thêm cache để build siêu nhanh

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        # 👈 Truyền ENV kết nối DB trực tiếp cho Spring Boot khi chạy Test
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/store?useSSL=false&allowPublicKeyRetrieval=true
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root@123
        run: ./gradlew test

      - name: Build JAR Package
        run: ./gradlew bootJar -x test # 👈 Đóng gói file .jar (bỏ qua test vì đã chạy ở bước trên)

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*.jar

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test